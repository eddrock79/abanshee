/* drifting motes / embers — spawned once, sized & timed at random */
(function makeMotes(){
  const box = document.getElementById("motes");
  if (!box) return;

  const W = window.innerWidth;
  const N = W < 700 ? 34 : W > 1600 ? 80 : 58;

  let html = "";
  for (let i = 0; i < N; i++) {
    const r = Math.random();

    // ~18% hot embers, ~28% warm amber, rest spectral motes
    const isEmber = r < 0.18;
    const isAmber = !isEmber && r < 0.46;
    const colored  = isEmber || isAmber;
    const moteClass = isEmber ? " ember" : isAmber ? " amber" : "";

    // Position across the full width
    const left = (Math.random() * 100).toFixed(2);

    // Size — embers bigger, motes smaller; slight non-square for embers
    let w, h;
    if (isEmber) {
      const base = 3.2 + Math.random() * 5.8;
      w = base.toFixed(2);
      h = (base * (0.75 + Math.random() * 0.45)).toFixed(2); // slight oval
    } else if (isAmber) {
      const base = 2.4 + Math.random() * 4.2;
      w = base.toFixed(2);
      h = (base * (0.78 + Math.random() * 0.4)).toFixed(2);
    } else {
      const base = 1.2 + Math.random() * 2.6;
      w = base.toFixed(2);
      h = (base * (0.85 + Math.random() * 0.3)).toFixed(2);
    }

    // Duration — embers faster (hotter air), motes lazier
    const dur = colored
      ? (12 + Math.random() * 18).toFixed(1)
      : (22 + Math.random() * 32).toFixed(1);

    // Stagger start so screen isn't empty on load
    const delay = (-Math.random() * parseFloat(dur)).toFixed(1);

    // Opacity ceiling
    const op = colored
      ? (0.48 + Math.random() * 0.46).toFixed(2)
      : (0.12 + Math.random() * 0.32).toFixed(2);

    // Two-stage winding sway: sw1 is the main drift, sw2 is a counter-drift higher up
    // This gives an S-curve path instead of a straight lean
    const sw1 = ((Math.random() * 2 - 1) * 42).toFixed(0);      // −42 to +42 px
    const sw2 = ((Math.random() * 2 - 1) * 28).toFixed(0);       // counter-drift

    // Scale targets — how much they shrink as they cool/rise
    const sc1 = colored ? (0.82 + Math.random() * 0.18).toFixed(2) : (0.88 + Math.random() * 0.12).toFixed(2);
    const sc2 = colored ? (0.30 + Math.random() * 0.28).toFixed(2) : (0.55 + Math.random() * 0.25).toFixed(2);

    // Initial rotation angle — embers tumble more
    const rot0 = (Math.random() * 360).toFixed(0);
    const spin = colored
      ? ((Math.random() * 2 - 1) * 55).toFixed(0)   // ±55 deg per quarter
      : ((Math.random() * 2 - 1) * 22).toFixed(0);

    // border-radius: embers slightly irregular, motes round
    const br = colored
      ? `${40 + Math.round(Math.random() * 20)}% ${60 - Math.round(Math.random() * 20)}% ${35 + Math.round(Math.random() * 25)}% ${55 + Math.round(Math.random() * 15)}%`
      : "50%";

    html += `<span class="mote${moteClass}" style="`
          + `left:${left}%;`
          + `width:${w}px;height:${h}px;`
          + `border-radius:${br};`
          + `--mo:${op};`
          + `--sw1:${sw1}px;--sw2:${sw2}px;`
          + `--sc1:${sc1};--sc2:${sc2};`
          + `--rot0:${rot0}deg;--spin:${spin}deg;`
          + `animation-duration:${dur}s;`
          + `animation-delay:${delay}s`
          + `"></span>`;
  }
  box.innerHTML = html;
})();

/* J = manual full-screen banshee jump scare. */
let STATIC_HOLDS=0;
function holdStatic(ms){
  const stat=document.getElementById("static");
  STATIC_HOLDS++;
  if(stat) stat.classList.add("show");
  setTimeout(()=>{
    STATIC_HOLDS=Math.max(0,STATIC_HOLDS-1);
    if(!STATIC_HOLDS && stat) stat.classList.remove("show");
  }, ms);
}
function fullBansheeJumpScare(force=false){
  if(!force && hauntControlsOpen()) return;
  const el=document.getElementById("jumpScare");
  if(!el || el._busy) return;
  const face=document.getElementById("jumpFace");
  const dur=1550;
  el._busy=true;
  if(face){ face.style.setProperty("--j-rot", (Math.random()*4-2).toFixed(1)+"deg"); }
  el.classList.add("awake");
  document.body.classList.add("jump-hit","haunt-tear");
  holdStatic(dur+360);
  setTimeout(hauntDeadBlink, 90);
  setTimeout(hauntSignalTear, 260);
  setTimeout(hauntTextTwitch, 430);
  setTimeout(hauntDeadBlink, 720);
  setTimeout(hauntSignalTear, 1160);
  setTimeout(()=>{
    el.classList.remove("awake");
    document.body.classList.remove("jump-hit","haunt-tear");
    if(face) face.style.removeProperty("--j-rot");
    el._busy=false;
  }, dur+140);
}
document.addEventListener("keydown", e=>{
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key==="j"||e.key==="J") fullBansheeJumpScare(true);
});

/* =====================================================================
   HAUNTED MICRO-EFFECTS
   - Tiny single-word/price twitches: frequent enough to be noticed, not enough to annoy.
   - Rare signal tears: the whole screen corrupts for a fraction of a second.
   - Very rare dead-frame: a blink-to-black, then normal. No obvious monster image.
   Test keys: T = text twitch, G = signal tear, H = hard haunt burst, J = manual jump scare.
   ===================================================================== */
function hauntControlsOpen(){
  const d=document.getElementById("drawer");
  return d && d.classList.contains("open");
}
function visibleHauntTargets(){
  const q=[
    ".pr-name", ".pr-price", ".prd-name", ".prd-ing",
    ".prd-head .prd-heading", ".pr-member-card", ".masthead h1",
    ".show .name", ".show .desc", ".show .time .start", ".cine-title", ".cine-blurb"
  ].join(",");
  return [...document.querySelectorAll(q)].filter(el=>{
    const r=el.getBoundingClientRect();
    return r.width>12 && r.height>8 && r.bottom>0 && r.top<window.innerHeight && getComputedStyle(el).visibility!=="hidden";
  });
}
function hauntTextTwitch(){
  if(hauntControlsOpen()) return;
  const els=visibleHauntTargets();
  if(!els.length) return;
  const el=els[Math.floor(Math.random()*els.length)];
  if(el.classList.contains("haunt-twitch")) return;
  el.dataset.hauntText=(el.textContent||"").trim();
  el.classList.add("haunt-twitch");
  setTimeout(()=>{ el.classList.remove("haunt-twitch"); delete el.dataset.hauntText; }, 700);
}
function hauntSignalTear(){
  if(hauntControlsOpen()) return;
  document.body.classList.add("haunt-tear");
  holdStatic(720);
  setTimeout(()=>{ document.body.classList.remove("haunt-tear"); }, 680);
}
function hauntDeadBlink(){
  if(hauntControlsOpen()) return;
  document.body.classList.add("dead-blink");
  setTimeout(()=>document.body.classList.remove("dead-blink"), 430);
}
function hauntBurst(){
  hauntSignalTear();
  setTimeout(hauntTextTwitch, 120);
  setTimeout(hauntDeadBlink, 520);
  setTimeout(hauntTextTwitch, 760);
}
function scheduleHauntEffects(){
  function randomLoop(fn,minMs,maxMs,firstMinMs=minMs,firstMaxMs=maxMs){
    const wait=firstMinMs + Math.random()*(firstMaxMs-firstMinMs);
    setTimeout(()=>{
      fn();
      randomLoop(fn,minMs,maxMs);
    }, wait);
  }

  // T — frequent little possession slips: every 10-30 seconds.
  randomLoop(hauntTextTwitch, 10*1000, 30*1000, 6*1000, 16*1000);

  // G — darker signal tear / dead-frame corruption: every 2-5 minutes.
  randomLoop(()=>{ Math.random()<.82 ? hauntSignalTear() : hauntDeadBlink(); }, 2*60*1000, 5*60*1000, 45*1000, 120*1000);

  // H — harder multi-hit haunt burst: every 2-5 minutes.
  randomLoop(hauntBurst, 2*60*1000, 5*60*1000, 75*1000, 150*1000);
  // J is manual only now — press J to trigger the full-screen jump scare.
}
scheduleHauntEffects();
document.addEventListener("keydown", e=>{
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key==="t"||e.key==="T") hauntTextTwitch();
  if(e.key==="g"||e.key==="G") hauntSignalTear();
  if(e.key==="h"||e.key==="H") hauntBurst();
});

/* =====================================================================
   CONTROL DRAWER
   ===================================================================== */
const drawer=document.getElementById("drawer");
function toggleDrawer(force){ const open=force!==undefined?force:!drawer.classList.contains("open");
  drawer.classList.toggle("open",open); drawer.setAttribute("aria-hidden",!open); }
document.getElementById("moonbtn").onclick=()=>toggleDrawer();
document.getElementById("drawerClose").onclick=()=>toggleDrawer(false);
document.addEventListener("keydown",e=>{ if(e.key==="c"||e.key==="C"){ if(document.activeElement.tagName!=="INPUT") toggleDrawer(); }
  if(e.key==="Escape") toggleDrawer(false); });

// mode buttons
const modeset=document.getElementById("modeset");
Object.entries(MODES).forEach(([k,m])=>{
  const b=document.createElement("button"); b.textContent=m.label; b.dataset.k=k;
  b.onclick=()=>{
    if(state.mode==="displayboard" && k!=="displayboard") cleanupDisplayBoard();
    state.mode=k;
    if(!state.useRealTime){ state.simStr=MODES[k].testDefault; simInput.value=state.simStr; }
    populateSrcInputs(); syncModeButtons(); loadData(); };
  modeset.appendChild(b);
});
function syncModeButtons(){ [...modeset.children].forEach(b=>b.classList.toggle("on",b.dataset.k===state.mode)); }

// realtime toggle
const rt=document.getElementById("realtime"), simInput=document.getElementById("simInput");
rt.checked=state.useRealTime; simInput.disabled=state.useRealTime;
document.getElementById("rtLabel").textContent=state.useRealTime?"Using real time (live)":"Frozen test time";
rt.onchange=()=>{ state.useRealTime=rt.checked; simInput.disabled=rt.checked;
  document.getElementById("rtLabel").textContent=rt.checked?"Using real time (live)":"Frozen test time";
  state.lastKey=""; render(); };
simInput.value=state.simStr;
simInput.onchange=()=>{ state.simStr=simInput.value; render(); };

// sheet source fields (follow the active mode)
const sheetIdI=document.getElementById("sheetId"), sheetTabI=document.getElementById("sheetTab");
function populateSrcInputs(){
  const s=MODES[state.mode].source;
  if(s.kind==="stub"||s.kind==="displayboard"||s.kind==="cinema"||s.kind==="prices"){
    sheetIdI.value=""; sheetTabI.value=""; sheetIdI.disabled=sheetTabI.disabled=true; return;
  }
  sheetIdI.disabled=sheetTabI.disabled=false;
  sheetIdI.value=s.sheetId||CONFIG.SHEET_ID;
  sheetTabI.value=(s.tab!==undefined?s.tab:CONFIG.SHEET_TAB)||"";
}
document.getElementById("reloadBtn").onclick=()=>{
  const s=MODES[state.mode].source;
  if(s.kind!=="stub"){ s.sheetId=sheetIdI.value.trim()||s.sheetId; s.tab=sheetTabI.value.trim(); }
  loadData();
};

/* =====================================================================
   SLIDESHOW  — cycle the existing boards with a slow, ghostly crossfade.
   Each board keeps its own layout exactly as-is; only a blur-and-fade
   carries you between them.

     ?play=1                         rotate the default set
     ?play=1&boards=normal,cinema,prices   choose & order the boards
     ?play=1&boards=normal:18,cinema:20,prices:14   per-board dwell (seconds)
     ?play=1&secs=20                 same dwell for every board (overrides defaults)

   While running: press  P  to pause/resume; opening the control drawer (C)
   pauses automatically so you can set things up without it swapping.
   ===================================================================== */
const SHOW = (function(){
  const on = params.has("play") && params.get("play")!=="0";
  // each board token may carry its own dwell: "cinema:20"
  const perSecs = {};
  let seq = (params.get("boards")||"").split(",").map(s=>s.trim()).filter(Boolean)
    .map(tok=>{ const [k,s]=tok.split(":"); const n=parseFloat(s); if(!isNaN(n)&&n>0) perSecs[k.trim()]=n; return k.trim(); })
    .filter(k=> k in MODES);
  if(!seq.length) seq = ["normal","cinema","prices"];
  const u = parseFloat(params.get("secs"));
  const uniform = (!isNaN(u) && u>0) ? u : null;   // a global ?secs= wins over per-board
  const DEF = { fringe:22, normal:18, gigs:18, cinema:20, prices:14, displayboard:20 };  // per-board defaults
  // Default to random horror transitions. Use ?fx=1..10 to force one style, or ?fx=0 for random.
  const fxVal = params.has("fx") ? parseInt(params.get("fx"), 10) : 0;
  return { on, seq, idx:0, timer:null, paused:false, fx:Number.isFinite(fxVal) ? fxVal : 0,
           secsFor:k=> uniform || perSecs[k] || DEF[k] || 16 };
})();
/* Horror transition engine.
   Ten different transitions are back, random by default, and every transition
   either hides the old board behind an overlay or makes the stage fully vanish
   before the data/content switches. */
let fxTimers=[];
function cancelFX(){
  fxTimers.forEach(clearTimeout); fxTimers=[];
  const s=document.querySelector(".stage");
  if(s){
    s.classList.remove("fx-flicker");
    Object.assign(s.style,{transition:"",opacity:"",filter:"",transform:""});
  }
  document.body.classList.remove("page-switching");
  const o=document.getElementById("fxOverlay");
  if(o){ o.className=""; o.style.cssText=""; }
}
function rAF2(fn){requestAnimationFrame(()=>requestAnimationFrame(fn));}

const FX_DATA={
  1:{name:"Ghost Dissolve", total:1900},
  2:{name:"Ring Tear",      total:1450},
  3:{name:"Cold Mist",      total:1650},
  4:{name:"Soul Rise",      total:1850},
  5:{name:"Blood Drain",    total:1550},
  6:{name:"Dying Candle",   total:1150},
  7:{name:"Funeral Veil",   total:1800},
  8:{name:"Possession Warp",total:1950},
  9:{name:"Apparition Bloom",total:1250},
 10:{name:"Shadow Hands",   total:2100},
};
function currentFX(){
  if(SHOW.fx===0) return 1 + Math.floor(Math.random()*10);
  return FX_DATA[SHOW.fx] ? SHOW.fx : (((SHOW.fx-1)%10)+1);
}

function applyFX(n,modeKey){
  cancelFX();
  const fx=FX_DATA[n]||FX_DATA[1];
  const st=document.querySelector(".stage");
  const ov=document.getElementById("fxOverlay");
  function sw(){
    if(state.mode==="displayboard") cleanupDisplayBoard();
    state.mode=modeKey;state.lastKey="";syncModeButtons();populateSrcInputs();loadData();
  }
  function T(ms,fn){ const id=setTimeout(fn,ms); fxTimers.push(id); }
  if(!st || !ov){ sw(); return fx.total; }
  document.body.classList.add("page-switching");

  function wrap(cls,coverMs,outMs,maxOp=1,holdMs=600){
    Object.assign(ov.style,{opacity:"0",transition:"none",transform:"scale(1.02)",filter:""});
    ov.className=cls;
    rAF2(()=>{
      ov.classList.add("fx-on");
      ov.style.transition=`opacity ${coverMs}ms ease, transform ${coverMs}ms ease`;
      ov.style.opacity=String(maxOp);
      ov.style.transform="scale(1)";
    });
    T(coverMs+40,()=>{
      sw();
      T(holdMs,()=>{
        ov.style.transition=`opacity ${outMs}ms ease, transform ${outMs}ms ease`;
        ov.style.opacity="0";
        ov.style.transform="scale(1.04)";
        T(outMs+90,()=>{ ov.className=""; ov.style.cssText=""; document.body.classList.remove("page-switching"); });
      });
    });
  }

  switch(n){
    case 1: // Ghost Dissolve
      wrap("fx-ghost",720,720,.98,260);
      Object.assign(st.style,{transition:"opacity .72s ease, filter .72s ease, transform .72s ease",opacity:"0",filter:"blur(15px) saturate(.18) brightness(.42)",transform:"scale(1.025) translateY(-8px)"});
      T(760,()=>{ Object.assign(st.style,{transition:"none",opacity:"0",filter:"blur(15px) saturate(.18) brightness(.42)",transform:"scale(.985) translateY(10px)"});
        T(260,()=>rAF2(()=>{ Object.assign(st.style,{transition:"opacity .72s ease, filter .72s ease, transform .72s ease",opacity:"1",filter:"",transform:""}); })); });
      T(fx.total,()=>Object.assign(st.style,{transition:"",opacity:"",filter:"",transform:""}));
      break;
    case 2: // Ring Tear
      wrap("fx-static",360,520,.92,180);
      st.style.animation="fxQuickTear .52s steps(1,end) 1";
      T(650,()=>{ st.style.animation=""; });
      break;
    case 3: // Cold Mist
      wrap("fx-fog",520,650,1,260);
      break;
    case 4: // Soul Rise
      Object.assign(st.style,{transition:"opacity .72s ease, transform .72s ease, filter .72s ease",opacity:"0",transform:"translateY(-46px)",filter:"blur(7px) brightness(.55)"});
      wrap("fx-soul",560,650,.97,260);
      T(620,()=>{ Object.assign(st.style,{transition:"none",opacity:"0",transform:"translateY(46px)",filter:"blur(7px) brightness(.55)"});
        T(340,()=>rAF2(()=>{ Object.assign(st.style,{transition:"opacity .72s ease, transform .72s ease, filter .72s ease",opacity:"1",transform:"translateY(0)",filter:""}); })); });
      T(fx.total,()=>Object.assign(st.style,{transition:"",opacity:"",filter:"",transform:""}));
      break;
    case 5: // Blood Drain
      wrap("fx-drain",540,620,.95,240);
      Object.assign(st.style,{transition:"filter .55s ease",filter:"saturate(.08) brightness(.48) contrast(1.35)"});
      T(1100,()=>Object.assign(st.style,{transition:"filter .55s ease",filter:""}));
      T(fx.total,()=>Object.assign(st.style,{transition:"",filter:""}));
      break;
    case 6: // Dying Candle Flicker
      st.classList.add("fx-flicker");
      T(930,()=>{
        Object.assign(st.style,{transition:"none",opacity:"0"});
        st.classList.remove("fx-flicker");
        sw();
        rAF2(()=>{ Object.assign(st.style,{transition:"opacity .2s ease",opacity:"1"}); });
      });
      T(fx.total,()=>{ st.classList.remove("fx-flicker"); Object.assign(st.style,{transition:"",opacity:"",filter:"",transform:""}); document.body.classList.remove("page-switching"); });
      break;
    case 7: // Funeral Veil
      Object.assign(ov.style,{opacity:"1",transform:"scaleY(0)",transformOrigin:"top center",transition:"none"});
      ov.className="fx-veil fx-on";
      rAF2(()=>{ ov.style.transition="transform .68s cubic-bezier(.35,0,.65,1)"; ov.style.transform="scaleY(1)"; });
      T(740,()=>{ sw(); T(260,()=>{ ov.style.transition="transform .68s cubic-bezier(.35,0,.65,1)"; ov.style.transform="scaleY(0)"; T(760,()=>{ ov.className=""; ov.style.cssText=""; document.body.classList.remove("page-switching"); }); }); });
      break;
    case 8: // Possession Warp
      wrap("fx-warp",560,720,.96,260);
      Object.assign(st.style,{transition:"opacity .72s ease, filter .72s ease, transform .72s ease",opacity:"0",filter:"blur(10px) contrast(2) brightness(.34)",transform:"scale(1.045) skewX(3deg)"});
      T(640,()=>{ Object.assign(st.style,{transition:"none",opacity:"0",filter:"blur(10px) contrast(2) brightness(.34)",transform:"scale(1.04) skewX(-3deg)"});
        T(350,()=>rAF2(()=>{ Object.assign(st.style,{transition:"opacity .7s ease, filter .7s ease, transform .7s ease",opacity:"1",filter:"",transform:""}); })); });
      T(fx.total,()=>Object.assign(st.style,{transition:"",opacity:"",filter:"",transform:""}));
      break;
    case 9: // Apparition Bloom
      wrap("fx-blink",230,520,.86,120);
      break;
    case 10: // Shadow Hands
      wrap("fx-creep",820,720,1,260);
      Object.assign(st.style,{transition:"filter .8s ease, transform .8s ease",filter:"brightness(.35) contrast(1.4)",transform:"scale(.99)"});
      T(1300,()=>Object.assign(st.style,{transition:"filter .6s ease, transform .6s ease",filter:"",transform:""}));
      T(fx.total,()=>Object.assign(st.style,{transition:"",filter:"",transform:""}));
      break;
    default:
      wrap("fx-ghost",720,720,.98,260);
  }
  return fx.total;
}
function slideshowStep(){
  if(SHOW.paused || drawer.classList.contains("open")){ SHOW.timer=setTimeout(slideshowStep, 2000); return; }
  SHOW.idx=(SHOW.idx+1)%SHOW.seq.length;
  const k=SHOW.seq[SHOW.idx];
  const totalMs=applyFX(currentFX(), k);
  SHOW.timer=setTimeout(slideshowStep, SHOW.secsFor(k)*1000 + totalMs);
}
function startSlideshow(){
  if(!SHOW.on) return;
  SHOW.idx=0;
  SHOW.timer=setTimeout(slideshowStep, SHOW.secsFor(SHOW.seq[0])*1000);
}
document.addEventListener("keydown", e=>{
  if(SHOW.on && (e.key==="p"||e.key==="P") && document.activeElement.tagName!=="INPUT") SHOW.paused=!SHOW.paused;
});

/* =====================================================================
   INIT
   ===================================================================== */
syncModeButtons();
populateSrcInputs();
if(params.get("test")==="1") toggleDrawer(true);
if(params.get("now")) { state.simStr=params.get("now"); simInput.value=state.simStr; }
if(SHOW.on){ state.mode=SHOW.seq[0]; syncModeButtons(); populateSrcInputs(); }  // start the rotation on its first board
loadData();
startSlideshow();
</script>
