}

/* ══════════════════════════════════════
   CINEMA — poster left, info right
   ══════════════════════════════════════ */
/* ── Landscape cinema: poster left narrow column, reel fills the right ── */
/* ══════════════════════════════════════════════════
   Landscape cinema — framed cards, same width,
   poster left (2:3) + backdrop right, text overlay
   ══════════════════════════════════════════════════ */

/* ── NUKE all portrait width constraints ── */
body.landscape .cinema,
body.landscape .cinema-land-inner,
body.landscape .cine-section,
body.landscape .cinmain,
body.landscape .cinema .cinfo,
body.landscape .cinema .upnext,
body.landscape .cinema .un-row,
body.landscape .cinema .cin-booking{
  max-width:none !important;
  width:100%;
}
body.landscape .cinema{
  flex-direction:column;align-items:stretch;
  height:100%;width:100%;overflow:hidden;
}
/* ── Outer padding wrapper ── */
body.landscape .cinema-land-inner{
  display:flex;flex-direction:column;
  height:100%;width:100%;
  gap:clamp(8px,.9vh,14px);
  padding:clamp(4px,.5vh,8px) 0 clamp(2px,.3vh,4px);
}
/* Each cine-section (today / tomorrow) takes equal height — remove portrait max-width */
body.landscape .cine-section{
  flex:1 1 0;min-height:0;
  display:flex;flex-direction:column;
  width:100%;max-width:none;
}
body.landscape .cinema-land-inner > .cine-section{flex:1 1 0}
/* Remove portrait max-width from all cinema text containers */
body.landscape .cinema .cinfo{max-width:none;width:auto;align-items:flex-start;text-align:left}
body.landscape .cinmain{max-width:none}
body.landscape .cinema .upnext{max-width:none}
/* Hide the day label — label shown inside the card instead */
body.landscape .cine-day-label{display:none}

/* ════════════════════════════════════════════════════
   HERO CARD — cinmain
   Framed card: poster left (~22%) + backdrop right (~78%)
   Text layout: label → meta → title → rule → overview
   Left-aligned in backdrop area, not bottom-overlaid
   ════════════════════════════════════════════════════ */
body.landscape .cinmain{
  flex:1 1 0;min-height:0;
  display:flex;flex-direction:row;align-items:stretch;
  border:1px solid rgba(180,140,100,.3);
  border-radius:10px;overflow:hidden;
  background:#08060e;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.7),
    0 6px 32px rgba(0,0,0,.8),
    inset 0 0 80px rgba(90,20,20,.08);
}

/* ── Poster column ── */
body.landscape .ci-ls-left{
  flex:0 0 22%;
  position:relative;overflow:hidden;
  background:#060410;
}
body.landscape .cinema .poster{
  width:100%;height:100%;
  display:flex;align-items:stretch;
}
body.landscape .cinema .poster img{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:center top;
}
body.landscape .cinema .noposter{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:"Cinzel Decorative","Cinzel",serif;font-size:clamp(14px,1.8vw,28px);
  color:var(--bone-faint);text-align:center;padding:1em;
}
/* Thin right border between poster and backdrop */
body.landscape .ci-ls-left::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(180,140,100,.35) 30%,rgba(180,140,100,.35) 70%,transparent);
}

/* ── Backdrop column ── */
body.landscape .ci-ls-right{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:clamp(16px,2.2vh,36px) clamp(18px,2.4vw,42px);
  position:relative;overflow:hidden;
  background:#08060e;
}
/* Backdrop reel — fills the entire right column */
body.landscape .ci-ls-right .reel{
  position:absolute;inset:0;width:100%;height:100%;
  margin:0;border-radius:0;z-index:0;
}
body.landscape .ci-ls-right .reel img{
  width:100%;height:100%;object-fit:cover;
  animation:reelKen 20s ease-in-out infinite alternate;
}
/* Poster fallback: blur so it never looks like a cropped poster */
body.landscape .ci-ls-right .reel.reel-poster-fallback img{
  filter:blur(22px) saturate(.5) brightness(.4);
  transform:scale(1.1);animation:none;
}
/* Gradient: dark left third (text area) fading to clear backdrop */
body.landscape .ci-ls-right::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(8,6,14,.96) 0%,
      rgba(8,6,14,.88) 22%,
      rgba(8,6,14,.62) 40%,
      rgba(8,6,14,.25) 60%,
      rgba(8,6,14,.06) 80%,
      transparent 100%),
    linear-gradient(0deg,
      rgba(8,6,14,.7) 0%,
      rgba(8,6,14,.3) 25%,
      transparent 55%);
}

/* ── Text layout (all z-index:2 so above reel+overlay) ── */
body.landscape .cinema .cinfo{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:flex-start;text-align:left;
  flex:1;
}
/* Label row: NOW PLAYING / TONIGHT etc */
body.landscape .cinema .cinfo .now-playing-badge,
body.landscape .cinema .cinfo .cwhen{
  font-family:"Cinzel",serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.28em;color:var(--spectre);
  font-size:clamp(11px,1.15vw,18px);
  display:flex;align-items:center;gap:.55em;
  margin-bottom:clamp(8px,.9vh,14px);
}
body.landscape .cinema .cinfo .cwhen{
  color:var(--spectre);
}
/* Meta line: time · cert · year · runtime */
body.landscape .cinema .cmeta{
  justify-content:flex-start;z-index:2;position:relative;
  font-size:clamp(13px,1.35vw,21px);gap:clamp(6px,.8vw,12px);
  margin-bottom:clamp(8px,.8vh,14px);
  letter-spacing:.06em;
}
/* Title — large, Cinzel Decorative */
body.landscape .cinema .cname{
  font-size:clamp(30px,4.4vw,76px);line-height:1.0;
  margin:0 0 clamp(10px,1vh,18px);
  position:relative;z-index:2;
  text-shadow:0 2px 20px rgba(0,0,0,.95);
  max-width:18ch;
}
/* Thin decorative rule below title */
body.landscape .cinema .cinfo::after{
  content:'';display:block;
  width:clamp(40px,5vw,80px);height:1px;
  background:linear-gradient(90deg,var(--spectre),transparent);
  margin-bottom:clamp(8px,.8vh,14px);
  flex-shrink:0;
}
/* Overview */
body.landscape .cinema .coverview{
  max-width:46ch;
  font-size:clamp(13px,1.4vw,22px);
  -webkit-line-clamp:4;
  position:relative;z-index:2;
  text-shadow:0 1px 6px rgba(0,0,0,.95);
  color:var(--bone-dim);line-height:1.5;
}

/* ════════════════════════════════════════════════════
   UP NEXT / LATER CARDS — same structure as hero card
   but via .upnext > .un-row > .un-card
   ════════════════════════════════════════════════════ */
body.landscape .cinema .upnext{
  flex:1 1 0;min-height:0;
  width:100%;margin:0;padding:0;
  display:flex;flex-direction:column;
}
body.landscape .cinema .un-row{
  flex:1;min-height:0;
  display:flex;
  gap:clamp(8px,.9vw,14px);
}
/* Each card: framed, same styling as hero */
body.landscape .cinema .un-card{
  flex:1 1 0;min-width:0;height:100%;
  display:flex;flex-direction:row;align-items:stretch;
  border:1px solid rgba(180,140,100,.22);
  border-radius:10px;overflow:hidden;
  background:#08060e;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.6),
    0 4px 20px rgba(0,0,0,.7),
    inset 0 0 60px rgba(90,20,20,.06);
}
/* Poster column ~22% */
body.landscape .cinema .un-poster{
  flex:0 0 22%;
  height:100%;
  object-fit:cover;object-position:center top;
  display:block;
  position:relative;
}
body.landscape .cinema .un-poster::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(180,140,100,.3) 30%,rgba(180,140,100,.3) 70%,transparent);
}
body.landscape .cinema .un-poster.un-nopost{
  display:flex;align-items:center;justify-content:center;
  flex:0 0 22%;
  color:var(--bone-faint);font-size:clamp(16px,2vw,32px);
  background:rgba(255,255,255,.02);
}
/* Backdrop fills the rest */
body.landscape .cinema .un-back{
  flex:1;position:relative;overflow:hidden;background:#06040e;
}
body.landscape .cinema .un-back img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:0;transition:opacity 2.5s ease;
  animation:reelKen 20s ease-in-out infinite alternate;
}
body.landscape .cinema .un-back img.active{opacity:1}
/* Overlay: same gradient direction as hero */
body.landscape .cinema .un-overlay{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:clamp(12px,1.8vh,28px) clamp(14px,1.8vw,30px);
  background:
    linear-gradient(90deg,
      rgba(8,6,14,.95) 0%,
      rgba(8,6,14,.85) 20%,
      rgba(8,6,14,.55) 40%,
      rgba(8,6,14,.2) 65%,
      transparent 85%),
    linear-gradient(0deg,
      rgba(8,6,14,.6) 0%,
      rgba(8,6,14,.25) 30%,
      transparent 55%);
}
body.landscape .cinema .un-label2{
  font-family:"Cinzel",serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.28em;color:var(--spectre);
  font-size:clamp(11px,1.15vw,18px);
  margin-bottom:clamp(6px,.7vh,12px);
  display:flex;align-items:center;gap:.55em;
}
body.landscape .cinema .un-label2::before{
  content:'';display:inline-block;
  width:.55em;height:.55em;border-radius:50%;
  background:var(--spectre);box-shadow:0 0 8px var(--spectre);
  flex-shrink:0;
}
body.landscape .cinema .un-when{
  font-family:"Cinzel",serif;
  font-size:clamp(12px,1.25vw,20px);
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--bone-dim);
  margin-bottom:clamp(6px,.7vh,10px);
}
body.landscape .cinema .un-title{
  font-family:"Cinzel Decorative","Cinzel",serif;font-weight:700;
  color:var(--bone);line-height:1.02;
  font-size:clamp(20px,2.8vw,50px);
  text-shadow:0 2px 16px rgba(0,0,0,.95);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:clamp(8px,.9vh,14px);
}
/* Thin rule below title in un-cards too */
body.landscape .cinema .un-overlay::after{
  content:'';display:block;
  width:clamp(30px,4vw,60px);height:1px;
  background:linear-gradient(90deg,var(--spectre),transparent);
  margin-bottom:clamp(8px,.8vh,12px);
  flex-shrink:0;
}
/* ══════════════════════════════════════
   PRICES — members' board
   ══════════════════════════════════════ */
body.landscape .prices{
  padding-top:clamp(3px,.5vh,6px);
  gap:0;
}
/* Member Cards banner — centred, but smaller */
body.landscape .pr-member-card{
  font-size:clamp(18px,2.6vw,42px);
  padding:clamp(6px,.8vh,12px) 0 clamp(4px,.6vh,8px);
}
body.landscape .prices .pr-note{
  font-size:clamp(12px,1.4vw,22px);
  margin-bottom:clamp(4px,.6vh,9px);
}
/* 3 columns — even fills for 6 items, no orphan */
body.landscape .prices .pr-list{
  grid-template-columns:repeat(3,1fr);
  gap:clamp(4px,.6vh,8px) clamp(6px,.9vw,12px);
  margin-bottom:clamp(4px,.6vh,8px);
}
body.landscape .pr-row{
  padding:clamp(4px,.55vh,8px) clamp(8px,1vw,14px);
}
body.landscape .pr-name{font-size:clamp(16px,2.2vw,34px)}
body.landscape .pr-sub{font-size:clamp(9px,1vw,14px);letter-spacing:.1em}
body.landscape .pr-price{
  font-size:clamp(16px,2.2vw,34px);
}
body.landscape .pr-price .cur{font-size:.72em}
body.landscape .pr-price .p2{font-size:.72em}
/* Cocktails + shooters — fill remaining space */
body.landscape .pr-drinks{
  flex:1 1 auto;min-height:0;
  margin-top:0;padding-top:clamp(4px,.6vh,8px);
  gap:clamp(8px,1.2vw,16px);
  width:100%;
}
/* ── Landscape prices: 3-column — Members left | Cocktails mid | Shooters right ── */
body.landscape .prices{
  align-items:stretch;width:100%;max-width:none;margin:0;
  display:flex;flex-direction:column;
}
body.landscape .pr-member-card{text-align:center;width:100%;flex-shrink:0}
body.landscape .prices .pr-note{text-align:center;flex-shrink:0}
/* Prices section: 3 equal columns side-by-side */
body.landscape .prices-body{
  flex:1 1 auto;min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:0;
  border-top:1px solid var(--rule);
  margin-top:clamp(4px,.6vh,8px);
}
/* Left column — member prices grid */
body.landscape .prices-body .pr-list-col{
  display:flex;flex-direction:column;
  border-right:1px solid var(--rule);
  padding:clamp(6px,.9vh,12px) clamp(8px,1.1vw,16px) clamp(6px,.9vh,12px) 0;
}
body.landscape .prices .pr-list{
  grid-template-columns:1fr;
  width:100%;flex:1;
  gap:clamp(3px,.4vh,6px) 0;
  margin-bottom:0;
  align-content:space-between;
}
body.landscape .pr-row{padding:clamp(7px,1vh,14px) clamp(10px,1.4vw,18px)}
/* Middle + right columns — cocktails and shooters */
body.landscape .prd-col{
  display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(6px,.9vh,12px) clamp(8px,1.1vw,16px);
  border-right:1px solid var(--rule);
}
body.landscape .prd-col:last-child{border-right:none}
body.landscape .prd-head{
  flex-direction:row;align-items:baseline;
  gap:.5em;flex-shrink:0;
  margin-bottom:clamp(4px,.6vh,8px);
  padding-bottom:clamp(3px,.45vh,5px);
  border-bottom:1px solid var(--rule);
}
body.landscape .prd-head .prd-heading{font-size:clamp(18px,2.4vw,38px);text-shadow:none}
body.landscape .prd-head .prd-price{font-size:clamp(14px,1.8vw,28px);text-shadow:none}
body.landscape .prd-list{gap:clamp(3px,.45vh,6px);flex:1;justify-content:space-between}
body.landscape .prd-card{
  flex:1 1 0;min-height:0;
  padding:clamp(5px,.7vh,10px) clamp(40px,5.5vw,72px) clamp(5px,.7vh,10px) clamp(10px,1.2vw,16px);
}
body.landscape .prd-name{font-size:clamp(15px,1.9vw,30px);line-height:1.15}
body.landscape .prd-ing{font-size:clamp(11px,1.4vw,22px);line-height:1.25;margin-top:2px}
body.landscape .prd-icon svg{width:clamp(20px,2.6vw,40px);height:clamp(20px,2.6vw,40px)}
body.landscape .prd-card .prd-icon{font-size:clamp(15px,2vw,30px);right:clamp(6px,.8vw,12px)}

/* ══════════════════════════════════════
   DISPLAY BOARD — 2-up side by side
   ══════════════════════════════════════ */
body.landscape .db-stage .db-label{display:none}
body.landscape .db-stage .db-counter{top:8px;right:10px}
body.landscape .db-img{object-fit:contain;width:100%;height:100%}

/* ── HD / High-DPI enhancement ── */
@media (min-width:1440px){
  .stage{gap:clamp(18px,1.8vh,32px)}
  .slots{gap:clamp(7px,1vh,16px)}
  .show{padding:clamp(8px,1vh,16px) clamp(14px,1.8vw,28px) clamp(8px,1vh,16px) clamp(16px,2vw,30px)}
  .cb-board{height:clamp(210px,26vh,340px)}
  .cinema .reel{width:min(76vw,600px)}
  .cinema .upnext{width:min(94vw,1100px)}
  .cine-thumb{height:clamp(88px,13vh,140px)}
}
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi){
  body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  img{image-rendering:high-quality}
}

/* ── Display Board — full-bleed image/PDF slideshow ────────────────── */
.db-stage{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--ink);overflow:hidden;
  opacity:0;transition:opacity 1.2s ease;
}
.db-stage.db-visible{ opacity:1; transition:opacity 1.2s ease; }
.db-stage.db-out{ opacity:0; transition:opacity 1.0s ease; }
/* Landscape 2-up: two poster panels side by side */
.db-stage.db-land{flex-direction:row;gap:clamp(16px,2.2vw,36px);padding:clamp(8px,1.2vw,20px) clamp(16px,2.4vw,48px);
  align-items:center;justify-content:space-evenly}
.db-stage.db-land .db-media{flex:0 1 auto;min-width:0;max-width:46%;position:static;border-radius:6px;overflow:hidden;background:#000;
  display:flex;align-items:center;justify-content:center;height:100%}
.db-stage.db-land .db-img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.db-stage.db-land .db-counter{top:8px;right:10px}
.db-media{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.db-img{
  width:100%;height:100%;object-fit:contain;object-position:center;
  display:block;
}
.db-frame{
  width:100%;height:100%;border:none;background:#fff;display:block;
}
/* Subtle label strip at the bottom, visible over images */
.db-label{
  position:absolute;bottom:0;left:0;right:0;z-index:2;
  padding:18px 28px 20px;
  background:linear-gradient(transparent,rgba(6,5,7,.72) 40%,rgba(6,5,7,.92));
  font-family:"Cinzel",serif;font-weight:600;letter-spacing:.06em;
  font-size:clamp(14px,2.2vw,24px);color:var(--bone);text-transform:uppercase;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
/* Slide counter pill, top-right */
.db-counter{
  position:absolute;top:16px;right:18px;z-index:3;
  font-family:"Cinzel",serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-faint);background:rgba(6,5,7,.55);
  border:1px solid var(--rule);border-radius:20px;
  padding:5px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
/* Empty / not-connected placeholder */
.db-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:16px;padding:40px;text-align:center;
}
.db-empty-icon{ font-size:clamp(48px,8vw,80px);opacity:.4; }
.db-empty-title{
  font-family:"Cinzel",serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  font-size:clamp(18px,3vw,28px);color:var(--bone-dim);
}
.db-empty-sub{
  font-family:"EB Garamond",serif;font-style:italic;color:var(--bone-faint);
  font-size:clamp(14px,1.8vw,19px);max-width:42ch;line-height:1.5;
}
/* When displayboard is active, the rooms section fills the whole stage */
.stage .rooms:has(.db-stage),
.stage .rooms:has(.db-empty){
  position:absolute;inset:0;padding:0;overflow:hidden;
}

/* ── cinema: today/tomorrow section splits ── */
.cine-section{display:flex;flex-direction:column;flex:0 0 auto;width:100%;max-width:820px}
.cine-section+.cine-section{margin-top:clamp(10px,1.6vh,18px);padding-top:clamp(10px,1.6vh,18px);border-top:1px solid var(--rule)}
.cine-day-label{font-family:"Cinzel",serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.28em;font-size:clamp(9px,1.1vw,14px);color:var(--spectre);
  margin-bottom:clamp(6px,1vh,12px);display:flex;align-items:center;gap:.6em}
.cine-day-label .cdl-dot{width:.55em;height:.55em;border-radius:50%;background:var(--spectre);
  box-shadow:0 0 8px var(--spectre);flex-shrink:0}
.cine-day-label.tomorrow{color:var(--bone-faint)}
.cine-day-label.tomorrow .cdl-dot{background:var(--bone-faint);box-shadow:none}
/* Now Playing badge */
.now-playing-badge{
  display:inline-flex;align-items:center;gap:.45em;
  font-family:"Cinzel",serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.22em;font-size:clamp(8px,.95vw,13px);
  color:var(--ember);
}
.now-playing-badge .np-dot{
  width:.6em;height:.6em;border-radius:50%;
  background:var(--ember);box-shadow:0 0 10px var(--ember);
  flex-shrink:0;animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
/* When now playing, tint the cinfo section */
.cine-section.now-playing .cname{color:#fff}
.cine-section.now-playing .cmeta .cwhen{color:var(--ember)}

/* ── private booking card ── */
.cin-booking .cb-slot{
  display:flex;align-items:baseline;gap:.8em;flex-wrap:wrap;
  margin-bottom:clamp(4px,.6vh,8px);
}
.cin-booking .cb-slot-time{
  font-family:"Cinzel",serif;font-weight:700;
  font-size:clamp(20px,3vw,50px);color:var(--spectre);
  letter-spacing:.04em;line-height:1;
  text-shadow:0 0 18px var(--spectre-soft);
}
.cin-booking .cb-slot-dur{
  font-family:"Cinzel",serif;font-size:clamp(10px,1.2vw,16px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--bone-faint);
  border:1px solid var(--rule);border-radius:3px;padding:.2em .7em;
}
body.landscape .cin-booking .cb-slot-time{font-size:clamp(14px,1.9vw,28px)}
body.landscape .cin-booking .cb-slot-dur{font-size:clamp(9px,.9vw,12px)}
.cin-booking{
  border:1px solid rgba(116,227,193,.25);border-radius:6px;
  background:linear-gradient(120deg,rgba(116,227,193,.06),rgba(116,227,193,.02));
  padding:clamp(14px,2vh,24px) clamp(16px,2.4vw,28px);
  display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);
  flex:0 0 auto;width:100%;max-width:820px;
}
.cin-booking .cb-eyebrow{font-family:"Cinzel",serif;font-size:clamp(9px,1vw,12px);
  letter-spacing:.32em;text-transform:uppercase;color:var(--spectre);opacity:.85}
.cin-booking .cb-title{font-family:"Cinzel Decorative","Cinzel",serif;font-weight:900;
  font-size:clamp(18px,2.8vw,38px);color:var(--bone);line-height:1.05}
.cin-booking .cb-tagline{font-family:"EB Garamond",serif;font-style:italic;
  font-size:clamp(13px,1.5vw,22px);color:var(--bone-dim);line-height:1.4}
.cin-booking .cb-body{font-family:"EB Garamond",serif;
  font-size:clamp(12px,1.35vw,18px);color:var(--bone-dim);line-height:1.5}
.cin-booking .cb-rule{height:1px;background:var(--rule);flex-shrink:0}
.cin-booking .cb-specs{display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(4px,.6vh,8px) clamp(12px,1.6vw,20px)}
.cin-booking .cb-spec{font-family:"EB Garamond",serif;font-size:clamp(11px,1.2vw,16px);
  color:var(--bone-dim);display:flex;gap:.5em;align-items:baseline}
.cin-booking .cb-spec b{font-family:"Cinzel",serif;font-size:.78em;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bone-faint);flex-shrink:0}
.cin-booking .cb-equip{display:flex;flex-wrap:wrap;gap:clamp(4px,.5vh,7px) clamp(6px,.8vw,10px)}
.cin-booking .cb-tag{font-family:"EB Garamond",serif;font-size:clamp(10px,1.1vw,15px);
  color:var(--bone-dim);border:1px solid var(--rule);border-radius:3px;
  padding:.2em .7em;white-space:nowrap}
.cin-booking .cb-note{font-family:"EB Garamond",serif;font-style:italic;
  font-size:clamp(10px,1.1vw,14px);color:var(--bone-faint);border-top:1px solid var(--rule);
  padding-top:clamp(6px,.9vh,10px);line-height:1.4}

/* landscape tweaks for the new sections */
/* landscape .cine-section defined above */
body.landscape .cin-booking{max-width:none}
body.landscape .cin-booking .cb-specs{grid-template-columns:repeat(3,1fr)}
body.landscape .cin-booking .cb-title{font-size:clamp(14px,1.8vw,26px)}
body.landscape .cin-booking .cb-tagline{font-size:clamp(11px,1.2vw,16px)}
body.landscape .cin-booking .cb-body{font-size:clamp(10px,1.1vw,14px)}
body.landscape .cin-booking .cb-spec{font-size:clamp(9px,.95vw,13px)}
body.landscape .cin-booking .cb-tag{font-size:clamp(9px,.95vw,12px)}
body.landscape .cine-day-label{font-size:clamp(8px,.9vw,11px)}

const MONTHS = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONNAMES = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

/* =====================================================================
   CSV PARSE
   ===================================================================== */
function parseCSV(text){
  const rows=[]; let row=[], field="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(field); field=""; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(ch==='\r'){ /* skip */ }
      else field+=ch;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* =====================================================================
   ROW -> SHOW  (parse the packed "when" cell)
   ===================================================================== */
function parseWhen(whenCell){
  // e.g. "12:00 - 13:00 ● Banshee Labyrinth (Venue 156) Chamber Room ● 2-24 August."
  const parts = whenCell.split("●").map(s=>s.trim());
  const timePart = parts[0]||"";
  const venuePart = parts[1]||"";
  const datePart = parts.slice(2).join(" ") || parts[parts.length-1] || "";

  const tm = timePart.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
  if(!tm) return null;
  const startMin = (+tm[1])*60 + (+tm[2]);
  let endMin    = (+tm[3])*60 + (+tm[4]);

  // room = text after the closing ")" of "(Venue NNN)"
  let roomText = venuePart;
  const close = venuePart.lastIndexOf(")");
  if(close>=0) roomText = venuePart.slice(close+1).trim();

  // month
  const mMatch = datePart.match(/([A-Za-z]+)/);
  let month=0;
  if(mMatch && MONTHS[mMatch[1].toLowerCase()]) month=MONTHS[mMatch[1].toLowerCase()];
  // days: take everything before the month word, parse "N" and "N-M" tokens
  const daySpec = mMatch ? datePart.slice(0,mMatch.index) : datePart;
  const days=new Set();
  daySpec.split(",").forEach(tok=>{
    tok=tok.trim();
    let r=tok.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})$/);
    if(r){ for(let d=+r[1]; d<=+r[2]; d++) days.add(d); return; }
    let s=tok.match(/^(\d{1,2})$/);
    if(s) days.add(+s[1]);
  });

  return {startMin,endMin,roomText,month,days,
          startLabel:`${tm[1].padStart(2,"0")}:${tm[2]}`,
          endLabel:`${tm[3].padStart(2,"0")}:${tm[4]}`};
}

function buildShows(rows, modeDef){
  const out=[];
  rows.forEach(r=>{
    if(!r || r.length<3) return;
    // find the "when" cell: contains our venue + a time/bullet
    let wi=-1;
    for(let i=0;i<r.length;i++){
      if(CONFIG.VENUE_MATCH.test(r[i]) && /[●]|\d{1,2}:\d{2}/.test(r[i])){ wi=i; break; }
    }
    if(wi<0) return;
    const when = parseWhen(r[wi]);
    if(!when) return;
    const name = (r[0]||"").trim();
    const genre = (r[1]||"").trim();
    let desc="";
    r.forEach((c,i)=>{ if(i!==0&&i!==1&&i!==wi && c && c.trim().length>desc.length) desc=c.trim(); });
    let roomKey=null;
    for(const rm of modeDef.rooms){ if(rm.match.test(when.roomText)||rm.match.test(r[wi])){ roomKey=rm.key; break; } }
    if(!roomKey) return;
    const month=when.month, days=when.days;
    out.push({ roomKey, title:name, genre, desc,
      startMin:when.startMin, endMin:when.endMin,
      startLabel:when.startLabel, endLabel:when.endLabel, noTime:false,
      onDate:(now)=> month===now.mo && days.has(now.day) });
  });
  return out;
}

/* ---------------------------------------------------------------------
   PRICES PARSER  — turn a prices sheet into {name, price, price2, note} rows.
   Header row is matched by name, so column order is flexible. Recognised:
     name : name | item | drink | product
     price: price | member | members | member price | amount | price 1
     price2: price2 | price 2 | second | large | big | size 2 | alt
     note : note | size | caption | detail | desc
   A leading "£" on prices is stripped. Rows with no name are skipped.
   --------------------------------------------------------------------- */
function buildPrices(rows){
  if(!rows || !rows.length) return [];
  let hi=rows.findIndex(r=> r.some(c=>/\b(name|item|drink|product)\b/i.test(c)));
  if(hi<0) hi=0;
  const H=rows[hi].map(c=>(c||"").trim().toLowerCase());
  const find=res=>H.findIndex(h=> res.some(re=>re.test(h)));
  const ci={
    name : find([/^(name|item|drink|product)$/, /name|item|drink|product/]),
    price: find([/^(price|member.?s?|member price|amount|price ?1)$/, /price|member|amount/]),
    p2   : find([/price ?2|second|large|big|size ?2|alt/]),
    note : find([/^(note|size|caption|detail|desc)$/, /note|size|caption|detail|desc/]),
  };
  if(ci.name<0) ci.name=0;
  const clean=v=>String(v||"").trim();
  const money=v=>clean(v).replace(/^£\s*/,"").trim();
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const name=clean(r[ci.name]); if(!name) continue;
    const price=ci.price>=0?money(r[ci.price]):"";
    const price2=ci.p2>=0?money(r[ci.p2]):"";
    const note=ci.note>=0?clean(r[ci.note]):"";
    out.push({ name, price, price2:price2||"", note:note||"" });
  }
  return out;
}

/* ---------------------------------------------------------------------
   GOOGLE-CALENDAR PARSER  (gigs / events export)
   --------------------------------------------------------------------- */
function stripHTML(s){
  return (s||"")
    .replace(/<br\s*\/?>/gi," ")
    .replace(/<\/(p|div|tr|td|table|h[1-6]|li)>/gi," ")
    .replace(/<[^>]+>/g," ")
    .replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<")
    .replace(/&gt;/gi,">").replace(/&#39;|&rsquo;|&apos;/gi,"'").replace(/&quot;/gi,'"')
    .replace(/\s+/g," ").trim();
}
function parseDMY(s){ const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m?{day:+m[1],mo:+m[2],y:+m[3]}:null; }
function parseDoorTime(text){
  const m=text.match(/doors?\s*(?:open(?:s|ing)?)?(?:\s*at)?\s*:?\.?\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i);
  if(!m) return null;
  let h=+m[1]; const mn=m[2]?+m[2]:0; const ap=(m[3]||"").toLowerCase();
  if(ap==="pm"&&h<12) h+=12;
  if(ap==="am"&&h===12) h=0;
  if(!ap && h>=1 && h<=11) h+=12;  // bare evening hour after "Doors" → assume pm
  if(h>23||mn>59) return null;
  return {min:h*60+mn, label:`${String(h).padStart(2,"0")}:${String(mn).padStart(2,"0")}`};
}
function parseTimeCell(s){ // calendar Start Time cell → {min,label}; handles "20:00", "8:00:00 PM", "8pm"
  s=String(s||"").trim(); if(!s) return null;
  const m=s.match(/(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm)?/i); if(!m) return null;
  let h=+m[1]; const mn=m[2]?+m[2]:0, ap=(m[3]||"").toLowerCase();
  if(ap==="pm"&&h<12) h+=12;
  if(ap==="am"&&h===12) h=0;
  if(h>23||mn>59) return null;
  return {min:h*60+mn, label:`${String(h).padStart(2,"0")}:${String(mn).padStart(2,"0")}`};
}
function extractBlurb(plain){
  // prefer a public band lineup or "FFO" line; never surface contacts/prices
  let b="";
  let m=plain.match(/bands?\s*:\s*([^]*?)(?=\b(eta|doors|end time|promoter|contact|price|fee|sound|event|extra|additional|poster|ticket)\b|$)/i);
  if(m) b=m[1];
  if(!b.trim()){ const f=plain.match(/ffo\s*:?\s*([^.]+)/i); if(f) b="FFO: "+f[1]; }
  b=b.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,"").replace(/https?:\/\/\S+/g,"")
     .replace(/[•|]+/g," ").replace(/\s+/g," ").trim().replace(/[,;:\-]+$/,"").trim();
  if(b.length<3) return "";
  if(b.length>120) b=b.slice(0,117).trim()+"…";
  return b;
}
// labels the board recognises in a description — used as boundaries so values don't bleed into each other
const NOTE_LABELS="bands|line ?up|support|djs?|blurb|about|info|details?|doors? ?open(?:s|ing)?|doors?|eta|end ?time|ends?|finish(?:es)?|load ?-? ?in|get ?in|sound ?check|stage ?times?|set ?times?|change ?over|curfew|contact(?: number)?|phone|tel|mob(?:ile)?|promoter|entry ?cost|entry ?price|entry ?fee|price|otd|on the door|adv(?:ance)?|entry|fee|cost|hire|tickets?|event ?link|link|facebook|fb|insta(?:gram)?|poster|name|ffo";
// time-style labels staff often write WITHOUT a colon (e.g. "Doors 8pm", "Load in 5pm")
const TIME_LABELS="doors? ?open(?:s|ing)?|doors?|eta|end ?time|load ?-? ?in|get ?in|sound ?check|stage ?times?|set ?times?|change ?over|curfew";
function noteField(plain,label){
  // value runs until the next heading, a time label, a link, or an internal cost note — whichever comes first
  const stop="\\b(?:"+NOTE_LABELS+")\\b\\s*:"
    +"|\\b(?:"+TIME_LABELS+")\\b\\s*\\d"
    +"|https?:\\/\\/|www\\.|fb\\.me\\/|facebook\\.com|instagram\\.com"
    +"|£\\s?\\d+\\s*(?:min|minimum)|\\bminimum to pay\\b|duty manager|%\\s?of the bar|door split|bar split|8pm[- ]?close"
    +"|$";
  const re=new RegExp("\\b(?:"+label+")\\s*:?\\s*([^]*?)(?="+stop+")","i");
  const m=plain.match(re); if(!m) return "";
  return m[1]
    .replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,"")          // emails
    .replace(/https?:\/\/\S+/gi,"").replace(/\b(?:fb\.me|bit\.ly|facebook\.com)\/\S+/gi,"") // links
    .replace(/\b0\d[\d ]{7,}\d\b/g,"").replace(/\b07\d{3}\s?\d{6}\b/g,"")  // phone numbers
    .replace(/[•|]+/g," ").replace(/\s{2,}/g," ").trim().replace(/[,;:\-–]+$/,"").trim();
}
function parsePrice(plain){
  // public entry price only — must be explicitly labelled; £30+ is treated as venue hire and hidden
  const m=plain.match(/\b(?:otd|on the door|door price|entry(?: ?cost| ?price| ?fee)?|adv(?:ance)?|price)\b\s*:?\s*(free|£\s?\d+(?:\.\d{2})?|\d+(?:\.\d{2})?)/i);
  if(!m) return "";
  let v=m[1].trim();
  if(/free/i.test(v)) return "Free";
  const num=parseFloat(v.replace(/[£\s]/g,""));
  if(isNaN(num)||num>=30) return "";   // £30+ = internal venue-hire cost, not entry → hide
  return "£"+(Number.isInteger(num)?num:num.toFixed(2));
}
function parseGigNotes(plain){
  const blurb=noteField(plain,"blurb")||noteField(plain,"about")||noteField(plain,"info")||noteField(plain,"details?");
  let bands=noteField(plain,"bands")||noteField(plain,"line ?up")||noteField(plain,"support");
  if(!bands){ const f=noteField(plain,"ffo"); if(f) bands="FFO: "+f; }
  const dj=noteField(plain,"djs?");
  const parts=[];
  if(blurb) parts.push(blurb);
  if(bands && bands.toLowerCase()!==blurb.toLowerCase()) parts.push(bands);
  if(dj && !/dj\b/i.test(parts.join(" "))) parts.push("DJ "+dj);
  let desc=parts.join(" — ");
  if(desc.length>200) desc=desc.slice(0,197).trim()+"…";
  return { desc, price:parsePrice(plain) };
}
function guessType(title){
  const t=title.toLowerCase();
  if(/karaoke/.test(t)) return "Karaoke";
  if(/\bdj\b|techno|disco|club night|girl germs|nocturnal/.test(t)) return "DJ Set";
  if(/take the stage|open mic/.test(t)) return "Open Mic";
  if(/quiz/.test(t)) return "Quiz";
  return "Live";
}
// drop private/admin entries entirely
const BOOKING_BLOCK=/^\s*(private\s+booking|possible\s+booking|potential\s+booking|booking|booked|tbc|hold)\s*$/i;
function buildEventsFromCalendar(rows, modeDef){
  if(!rows || !rows.length) return [];
  let hi=rows.findIndex(r=> r.some(c=>/event title/i.test(c)) && r.some(c=>/start date/i.test(c)));
  if(hi<0) hi=0;
  const H=rows[hi].map(c=>(c||"").trim().toLowerCase());
  const col=name=>H.findIndex(h=>h===name);
  const ci={ cal:col("calendar name"), title:col("event title"), desc:col("description"),
             sdate:col("start date"), stime:col("start time"), allday:col("all day") };
  const calMatch=modeDef.source.calMatch||/.*/;
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const cal=(r[ci.cal]||"").trim();
    if(!calMatch.test(cal)) continue;
    const title=(r[ci.title]||"").trim();
    if(!title || BOOKING_BLOCK.test(title) || /rehearsal/i.test(title)) continue;
    const d=parseDMY(r[ci.sdate]); if(!d) continue;
    const plain=stripHTML(r[ci.desc]||"");
    const isAllDay=/^(true|yes|1)$/i.test((r[ci.allday]||"").trim());
    // door time: a "Doors:" line in the notes wins; otherwise fall back to the event's own start time
    let door=parseDoorTime(plain);
    if(!door && !isAllDay) door=parseTimeCell(r[ci.stime]);
    const y=d.y, mo=d.mo, day=d.day;
    const dkey=`${y}-${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const notes=parseGigNotes(plain);
    out.push({
      roomKey: modeDef.rooms[0].key,
      title, genre:guessType(title), desc:notes.desc, price:notes.price,
      startMin: door?door.min:null, endMin:null,
      startLabel: door?door.label:"Tonight", endLabel:null,
      noTime: !door, y, mo, day, dkey,
      onDate:(now)=> now.y===y && now.mo===mo && now.day===day,
    });
  }
  return out;
}

function getNow(){
  const d = state.useRealTime ? new Date() : new Date(state.simStr);
  return {date:d, y:d.getFullYear(), mo:d.getMonth()+1, day:d.getDate(),
          min:d.getHours()*60+d.getMinutes(), dow:d.getDay()};
}
function fmtClock(d){
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${hh}<span class="c">:</span>${mm}`;
}

/* =====================================================================
   DISPLAY BOARD URL NORMALISER
   Converts Dropbox / Google Drive share links into direct-load URLs.
   Any other URL is returned as-is.
   ===================================================================== */
function dbDirectUrl(url){
  if(!url) return "";
  url=url.trim();

  // Dropbox share link → direct download
  // https://www.dropbox.com/s/xxx/file.jpg?dl=0  →  ?dl=1
  if(/dropbox\.com/i.test(url)){
    if(/[?&]dl=\d/.test(url)) return url.replace(/([?&])dl=\d/,"$1dl=1");
    if(url.includes("?")) return url+"&raw=1";
    return url+"?raw=1";
  }

  // Google Drive — extract the file ID and use the thumbnail API
  // which works cross-origin without auth for publicly shared files.
  // Handles:
  //   /file/d/FILE_ID/view
  //   /open?id=FILE_ID
  //   /uc?id=FILE_ID
  const gdId = dbGDriveId(url);
  if(gdId){
    // Use the thumbnail endpoint — it works cross-origin & handles images and PDFs
    return `https://lh3.googleusercontent.com/d/${gdId}`;
  }

  return url;
}

function dbGDriveId(url){
  // /file/d/ID/view
  let m=url.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  // ?id=ID or &id=ID
  m=url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  return null;
}

function gviz(id,tab){
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`+(tab?`&sheet=${encodeURIComponent(tab)}`:"");
}
async function loadData(){
  const mode=MODES[state.mode], src=mode.source;
  setStatus("Loading…"); state.dataStatus="loading"; paintSrc();

  if(src.kind==="stub"){
    state.rows=[]; state.dataStatus="stub"; paintSrc();
    setStatus(src.note||"Not connected yet."); render(); return;
  }
  if(src.kind==="prices"){
    state.pricesNote=(CONFIG.PRICES&&CONFIG.PRICES.note)||"";
    const fallback=()=>{ state.prices=((CONFIG.PRICES&&CONFIG.PRICES.items)||[]).map(it=>({...it})); };
    if(CONFIG.PRICES_SHEET_ID){
      try{
        const res=await fetch(gviz(CONFIG.PRICES_SHEET_ID, CONFIG.PRICES_TAB),{cache:"no-store"});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const items=buildPrices(parseCSV(await res.text()));
        if(!items.length) throw new Error("no price rows");
        state.prices=items; state.dataStatus="live"; paintSrc();
        setStatus(`Live · ${items.length} prices from the sheet.`);
      }catch(err){
        fallback(); state.dataStatus="sample"; paintSrc();
        setStatus("Couldn't read the prices sheet — showing the built-in list.\n("+err.message+")\nCheck PRICES_SHEET_ID / tab and that it's shared ‘Anyone with the link – Viewer’.");
      }
    } else {
      fallback(); state.dataStatus="sample"; paintSrc();
      setStatus("No prices sheet set yet — showing the built-in list. Create the sheet, then paste its ID into CONFIG.PRICES_SHEET_ID.");
    }
    render(); return;
  }
  if(src.kind==="combo"){
    let gigOK=false, cinOK=false; const msgs=[];
    try{
      const gigMode={ rooms:[{key:"molly",name:"Molly's Chamber",match:/.*/}], source:{calMatch:src.gigCalMatch||/mollys chamber|stage bar/i} };
      const id=src.sheetId||CONFIG.GIGS_SHEET_ID, tab=(src.tab!==undefined?src.tab:CONFIG.GIGS_TAB);
      const res=await fetch(gviz(id,tab),{cache:"no-store"}); if(!res.ok) throw new Error("gigs HTTP "+res.status);
      const ev=buildEventsFromCalendar(parseCSV(await res.text()), gigMode);
      if(!ev.length) throw new Error("no gig rows");
      state.rows=ev; gigOK=true;
    }catch(err){
      state.rows=buildEventsFromCalendar(SAMPLE_GIGS_ROWS.map(r=>r.slice()), {rooms:[{key:"molly",match:/.*/}],source:{calMatch:/mollys chamber|stage bar/i}});
      msgs.push("gigs sample ("+err.message+")");
    }
    try{
      if(CONFIG.CINEMA_API){
        const r=await fetch(CONFIG.CINEMA_API+"?action=list&t="+Date.now(),{cache:"no-store"});
        if(!r.ok) throw new Error("cinema HTTP "+r.status);
        const j=await r.json(); state.cinema=Array.isArray(j)?j:[]; cinOK=true;
      } else { state.cinema=SAMPLE_CINEMA.slice(); msgs.push("cinema sample (no API set)"); }
    }catch(err){ state.cinema=SAMPLE_CINEMA.slice(); msgs.push("cinema sample ("+err.message+")"); }
    state.dataStatus=(gigOK&&cinOK)?"live":"sample"; paintSrc();
    setStatus((gigOK&&cinOK)?"Live · gigs + cinema loaded.":("Showing some sample — "+msgs.join("; ")));
    state._cinemaSig=""; render(); return;
  }
  if(src.kind==="displayboard"){
    if(!CONFIG.CINEMA_API){
      state.displayFiles=[]; state.dataStatus="stub"; paintSrc();
      setStatus("No API set — add CONFIG.CINEMA_API to board.html.");
      render(); return;
    }
    try{
      const r=await fetch(CONFIG.CINEMA_API+"?action=db_list&t="+Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json();
      state.displayFiles=Array.isArray(j)?j.map(it=>({
        name: it.name||"",
        url:  dbDirectUrl(it.url||""),
        ext:  (it.url||"").split("?")[0].split(".").pop().toLowerCase(),
        on:   it.on
      })).filter(it=>it.url && it.on!==false):[];
      state.dataStatus=state.displayFiles.length?"live":"stub"; paintSrc();
      setStatus(state.displayFiles.length
        ? `${state.displayFiles.length} poster(s) loaded.`
        : "No posters added yet — go to Settings → Display Board.");
    }catch(err){
      state.displayFiles=[]; state.dataStatus="error"; paintSrc();
      setStatus("Couldn't load poster list ("+err.message+").");
    }
    render(); return;
  }
  if(src.kind==="cinema"){
    try{
      let list;
      if(CONFIG.CINEMA_API){
        const r=await fetch(CONFIG.CINEMA_API+"?action=list&t="+Date.now(),{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        list=await r.json(); state.dataStatus="live"; paintSrc();
        setStatus(`Live · ${list.length} cinema entries from the manager page.`);
      } else {
        list=SAMPLE_CINEMA.slice(); state.dataStatus="sample"; paintSrc();
        setStatus("No Cinema API set yet — showing sample. Deploy the Apps Script, then paste its /exec URL into CONFIG.CINEMA_API.");
      }
      state.cinema=Array.isArray(list)?list:[];
    }catch(err){
      state.cinema=SAMPLE_CINEMA.slice(); state.dataStatus="sample"; paintSrc();
      setStatus("Couldn't reach the Cinema source — showing sample.\n("+err.message+")");
    }
    state._cinemaSig=""; render(); return;
  }
  const id=src.sheetId||CONFIG.SHEET_ID;
  const tab=(src.tab!==undefined?src.tab:CONFIG.SHEET_TAB);
  try{
    const res=await fetch(gviz(id,tab),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const rows=parseCSV(await res.text());
    const events = src.kind==="gcal" ? buildEventsFromCalendar(rows,mode) : buildShows(rows,mode);
    if(!events.length) throw new Error("No matching rows found");
    state.rows=events; state.dataStatus="live"; paintSrc();
    setStatus(`Live · ${events.length} ${mode.label} items loaded.`);
  }catch(err){
    state.rows = src.kind==="gcal"
      ? buildEventsFromCalendar(SAMPLE_GIGS_ROWS.map(r=>r.slice()), mode)
      : buildShows(SAMPLE_ROWS.map(r=>r.slice()), mode);
    state.dataStatus="sample"; paintSrc();
    setStatus("Couldn't reach the live sheet — showing the built-in sample.\n("+err.message+")\nCheck the Sheet ID / tab and that it's shared ‘Anyone with the link – Viewer’.");
  }
  render();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const mode=MODES[state.mode];
  const now=getNow();

  document.getElementById("eyebrow").textContent=mode.eyebrow;
  document.getElementById("title").textContent=mode.title;
  document.getElementById("footNote").textContent=mode.foot;

  const validDate=!isNaN(now.date.getTime());
  document.getElementById("whenLabel").textContent = validDate
    ? `${DAYNAMES[now.dow]} ${now.day} ${MONNAMES[now.mo]}` : "Set a date →";
  document.getElementById("clock").innerHTML = validDate ? fmtClock(now.date) : "--<span class='c'>:</span>--";

  if(mode.layout==="cinema"){ renderCinema(now, validDate); return; }
  if(mode.layout==="tonight"){ renderTonight(now, validDate); return; }
  if(mode.layout==="prices"){ renderPrices(); return; }
  if(mode.layout==="displayboard"){ renderDisplayBoard(); return; }

  const wrap=document.getElementById("rooms");
  wrap.innerHTML="";

  const perRoom=mode.perRoom||3;
  const minSlots=(mode.minSlots!=null)?mode.minSlots:3;
  const keepAll=!!mode.keepAllDay;
  const isStub=mode.source.kind==="stub";

  mode.rooms.forEach((rm,ri)=>{
    let list=[];
    if(!isStub && validDate){
      list=state.rows
        .filter(s=> s.roomKey===rm.key && s.onDate(now))
        .map(s=>{ let _end=null; if(s.startMin!=null){ _end=(s.endMin!=null?s.endMin:s.startMin+150); if(_end<=s.startMin)_end+=1440; } return {...s,_end}; })
        .filter(s=> keepAll || s.startMin==null || s._end>now.min)
        .sort((a,b)=> (a.startMin==null?1e9:a.startMin) - (b.startMin==null?1e9:b.startMin))
        .slice(0,perRoom);
    }

    const room=document.createElement("div");
    room.className="room"+(list.length?"":" dark");

    const head=document.createElement("div");
    head.className="room-head";
    const countTxt = isStub ? "" : (list.length ? (keepAll? list.length+" tonight" : "next "+list.length) : "dark");
    head.innerHTML=`<span class="glyph">✦</span><h2>${rm.name}</h2><span class="line"></span><span class="count">${countTxt}</span>`;
    room.appendChild(head);

    const slots=document.createElement("div");
    slots.className="slots";

    if(isStub){
      const e=document.createElement("div"); e.className="empty-room";
      e.style.animationDelay=(ri*.08)+"s";
      e.textContent=mode.source.note;
      slots.appendChild(e);
    } else if(!list.length){
      const e=document.createElement("div"); e.className="empty-room";
      e.style.animationDelay=(ri*.08)+"s";
      e.textContent= !validDate ? "Choose a date to see what's on." : (mode.emptyText||"Nothing scheduled.");
      slots.appendChild(e);
    } else {
      list.forEach((s,i)=>{
        const live = s.startMin!=null && s.startMin<=now.min && (s._end==null || now.min<s._end);
        const el=document.createElement("div");
        el.className="show"+(live?" live":"");
        el.style.animationDelay=(ri*.18 + i*.09)+"s";
        const startStyle = s.noTime ? ' style="font-size:clamp(13px,1.6vw,18px);letter-spacing:.03em"' : '';
        el.innerHTML=`
          <div class="time"><span class="start"${startStyle}>${esc(s.startLabel)}</span>${s.endLabel?`<span class="end">til ${esc(s.endLabel)}</span>`:""}</div>
          <div class="body">
            <div class="titleline">
              <span class="name">${esc(s.title)}</span>
              ${s.genre?`<span class="genre">${esc(s.genre)}</span>`:""}
            </div>
            ${s.desc?`<div class="desc">${esc(s.desc)}</div>`:""}
          </div>
          <div class="nowtag"><span class="dot"></span>On Now</div>`;
        slots.appendChild(el);
      });
      for(let i=list.length;i<minSlots;i++){
        const g=document.createElement("div"); g.className="ghostslot";
        g.style.animationDelay=(ri*.18 + i*.09)+"s";
        g.innerHTML=`<span class="g">⌁</span><span>${keepAll?"no more tonight":"nothing further today"}</span>`;
        slots.appendChild(g);
      }
    }
    room.appendChild(slots);
    wrap.appendChild(room);
  });
}

/* =====================================================================
   DISPLAY BOARD  — cycles through poster images/PDFs full-screen.

   TWO modes of operation:
   1. Direct  (?mode=displayboard) — internal timer advances through all
      images automatically. Each image shows for DB_SECS seconds.
   2. Slideshow (?play=1&boards=...) — the outer slideshow calls this
      on every board visit. Each visit shows the NEXT image in sequence
      and hands control back to the outer loop immediately.
      (_dbIdx persists in state so each visit advances by one.)
   ===================================================================== */
const DB_SECS = 15; // seconds per image in direct/standalone mode

function renderDisplayBoard(){
  const wrap=document.getElementById("rooms");
  const files=Array.isArray(state.displayFiles)?state.displayFiles:[];

  // Hide the standard header/clock/footer — they'd fight the full-bleed image
  const header=document.querySelector(".stage header");
  const footer=document.querySelector(".stage .footer");
  if(header) header.style.display="none";
  if(footer) footer.style.display="none";

  if(!files.length){
    if(state._dbSlideTimer){ clearInterval(state._dbSlideTimer); state._dbSlideTimer=null; }
    if(header) header.style.display="";
    if(footer) footer.style.display="";
    wrap.innerHTML=`<div class="db-empty">
      <div class="db-empty-icon">📁</div>
      <div class="db-empty-title">No posters added yet</div>
      <div class="db-empty-sub">Go to Settings → Display Board and paste in your Dropbox or Google Drive share links.</div>
    </div>`;
    return;
  }

  // GUARD: if a slide is already showing, this call is from a clock tick or
  // data refresh — not a deliberate board change. Do nothing; the slide
  // timer owns the cadence from here.
  if(wrap.querySelector(".db-stage")){
    return;
  }

  // Clamp index and clear any stale timer
  if(state._dbIdx>=files.length) state._dbIdx=0;
  if(state._dbSlideTimer){ clearInterval(state._dbSlideTimer); state._dbSlideTimer=null; }

  function showSlide(idx){
    if(!files.length) return;
    idx = ((idx % files.length) + files.length) % files.length;
    state._dbIdx = idx;

    const f=files[idx];
    const isPDF=/\.pdf(\?.*)?$/i.test(f.url);
    const mediaEl=isPDF
      ? `<iframe class="db-frame" src="${esc(f.url)}" title="${esc(f.name||"")}" allowfullscreen></iframe>`
      : `<img class="db-img" src="${esc(f.url)}" alt="${esc(f.name||"")}">`;

    const rawName=(f.name||"").replace(/\.\w+$/,"").replace(/[-_]+/g," ").trim();
    const showLabel=rawName && !/^\d{8,}$/.test(rawName);
    const labelEl=showLabel?`<div class="db-label">${esc(rawName)}</div>`:"";
    const counter=files.length>1?`<div class="db-counter">${idx+1} / ${files.length}</div>`:"";

    // In landscape mode, show two posters side by side
    let secondMediaEl = "";
    if(IS_LANDSCAPE && files.length > 1){
      const nextIdx = (idx + 1) % files.length;
      const f2 = files[nextIdx];
      const isPDF2 = /\.pdf(\?.*)?$/i.test(f2.url);
      secondMediaEl = isPDF2
        ? `<iframe class="db-frame" src="${esc(f2.url)}" title="${esc(f2.name||"")}" allowfullscreen style="flex:1;min-width:0"></iframe>`
        : `<img class="db-img" src="${esc(f2.url)}" alt="${esc(f2.name||"")}" style="flex:1;min-width:0;object-fit:contain">`;
    }

    wrap.innerHTML=`<div class="db-stage db-in${IS_LANDSCAPE?" db-land":""}">
      <div class="db-media"${IS_LANDSCAPE?' style="flex:1;min-width:0"':''}>${mediaEl}</div>
      ${IS_LANDSCAPE && secondMediaEl ? `<div class="db-media" style="flex:1;min-width:0">${secondMediaEl}</div>` : ""}
      ${!IS_LANDSCAPE ? labelEl : ""}${counter}
    </div>`;

    function revealSlide(){
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const s=wrap.querySelector(".db-stage");
        if(s){ s.classList.remove("db-in"); s.classList.add("db-visible"); }
      }));
    }

    if(!isPDF){
      // Wait for the image to actually load before fading it in — prevents the white flash
      const img=wrap.querySelector(".db-img");
      if(img && !img.complete){
        img.addEventListener("load",  revealSlide, {once:true});
        img.addEventListener("error", revealSlide, {once:true});
        setTimeout(revealSlide, 4000); // safety fallback
      } else {
        revealSlide();
      }
    } else {
      revealSlide();
    }
  }

  function advanceSlide(){
    // Guard against stale timers firing after leaving displayboard mode
    if(state.mode !== "displayboard"){ clearInterval(state._dbSlideTimer); state._dbSlideTimer=null; return; }
    const s=wrap.querySelector(".db-stage");
    if(s){ s.classList.remove("db-visible"); s.classList.add("db-out"); }
    setTimeout(()=>{
      // In landscape 2-up mode advance by 2 so we always show a fresh pair
      showSlide((state._dbIdx + (IS_LANDSCAPE && files.length > 1 ? 2 : 1)) % files.length);
    }, 1100); // wait for db-out fade (1.0s) before swapping
  }

  if(SHOW.on){
    // SLIDESHOW MODE — outer slideshowStep owns board-level cadence.
    // Show the current image; pre-advance index so next visit shows the next one.
    showSlide(state._dbIdx);
    state._dbIdx = (state._dbIdx + (IS_LANDSCAPE && files.length > 1 ? 2 : 1)) % files.length;
  } else {
    // DIRECT MODE (?mode=displayboard) — internal timer cycles images.
    showSlide(state._dbIdx);
    if(files.length > 1){
      state._dbSlideTimer = setInterval(advanceSlide, DB_SECS * 1000);
    }
  }
}

// When leaving displayboard mode, restore the header/footer
function cleanupDisplayBoard(){
  if(state._dbSlideTimer){ clearInterval(state._dbSlideTimer); state._dbSlideTimer=null; }
  const header=document.querySelector(".stage header");
  const footer=document.querySelector(".stage .footer");
  if(header) header.style.display="";
  if(footer) footer.style.display="";
}

  const landBodyClose = IS_LANDSCAPE ? `</div>` : "";  // closes pr-list-col (drinks appended after)
  const landBodyEnd   = IS_LANDSCAPE ? `</div>` : "";  // closes prices-body

      <span class="pr-dots"></span>
      <span class="pr-price"><span class="cur">£</span>${esc(it.price)}${p2}</span>
    </div>`;
  });
  html+=`</div>`;  // close .pr-list
  if(IS_LANDSCAPE){
    // Close left col, append cocktails+shooters as the 2nd+3rd cols, close prices-body
    html+=`</div>`;   // close .pr-list-col
    const drinks=buildDrinksMenu();
    // buildDrinksMenu returns <div class="pr-drinks"><div class="prd-col">...</div><div class="prd-col">...</div></div>
    // Strip the outer pr-drinks wrapper so prd-cols sit directly in prices-body
    html+=drinks.replace(/^<div class="pr-drinks">/,"").replace(/<\/div>$/,"");
    html+=`</div>`;   // close .prices-body
  } else {
    html+=buildDrinksMenu();
  }
  html+=`</div>`;  // close .prices
  wrap.innerHTML=html;
}

/* =====================================================================
   CINEMA  — manager picks a film; the board fetches poster/synopsis/
   runtime/trailer from TMDB and shows it big.
   ===================================================================== */
const tmdbCache={};
async function tmdbLookup(title,year){
  const ck=(title+"|"+(year||"")).toLowerCase();
  if(tmdbCache[ck]) return tmdbCache[ck];
  const out={title,year,poster:null,overview:"",runtime:null,trailer:null,backdrops:[],found:false};
  try{
    if(!CONFIG.TMDB_KEY) throw new Error("no TMDB key");
    const sUrl=`https://api.themoviedb.org/3/search/movie?api_key=${CONFIG.TMDB_KEY}&query=${encodeURIComponent(title)}`+(year?`&year=${encodeURIComponent(year)}`:"");
    const sj=await (await fetch(sUrl)).json();
    const hit=(sj.results||[])[0];
    if(hit){
      out.found=true; out.title=hit.title||title;
      out.overview=hit.overview||"";
      out.poster=hit.poster_path?`https://image.tmdb.org/t/p/w500${hit.poster_path}`:null;
      out.year=(hit.release_date||"").slice(0,4)||year;
      const dj=await (await fetch(`https://api.themoviedb.org/3/movie/${hit.id}?api_key=${CONFIG.TMDB_KEY}&append_to_response=videos,images&include_image_language=en,null`)).json();
      if(dj.runtime) out.runtime=dj.runtime;
      if(dj.overview) out.overview=dj.overview;
      const vids=((dj.videos||{}).results)||[];
      const tr=vids.find(v=>v.site==="YouTube"&&/trailer/i.test(v.type))||vids.find(v=>v.site==="YouTube");
      if(tr) out.trailer=tr.key;
      // backdrop stills for an ambient reel (reliable, unlike embeds)
      const bd=((dj.images||{}).backdrops||[]).map(b=>b.file_path).filter(Boolean);
      if(dj.backdrop_path) bd.unshift(dj.backdrop_path);
      out.backdrops=[...new Set(bd)].slice(0,5).map(p=>`https://image.tmdb.org/t/p/w1280${p}`);
    }
  }catch(e){ out.error=e.message; }
  tmdbCache[ck]=out; return out;
}
function isoDate(now){ return `${now.y}-${String(now.mo).padStart(2,"0")}-${String(now.day).padStart(2,"0")}`; }
function ymdLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function normDate(s){ // accept ISO, DD/MM/YYYY, or a Sheets date-object/timestamp string
  s=String(s||"").trim();
  // plain calendar date — take the digits literally, no timezone maths
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  // anything with a time/zone component (e.g. "...T23:00:00Z" or a Date string) → resolve to the LOCAL day
  const d=new Date(s); if(!isNaN(d)) return ymdLocal(d);
  return s;
}
function parseClock(s){ const m=String(s||"").match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; }
function clockLabel(mins){ if(mins==null) return ""; mins=((Math.round(mins)%1440)+1440)%1440; return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`; }
function gigDateLabel(s, now){
  const d=new Date(s.y, s.mo-1, s.day), today=new Date(now.y, now.mo-1, now.day);
  const diff=Math.round((d-today)/86400000);
  if(diff===0) return "Tonight";
  if(diff===1) return "Tomorrow";
  const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let lbl=`${WD[d.getDay()]} ${s.day}`;
  if(s.mo!==now.mo) lbl+=" "+MO[s.mo-1];
  return lbl;
}
function cinemaMsg(text){ return `<div class="cinemaMsg">${esc(text)}</div>`; }

/* Films for a given date, enriched from TMDB, with rough start times chained
   from the first film's runtime (+15 min changeover) when later times are blank. */
const GAP_MIN=15;
// Films before this hour (3am) are treated as part of the previous calendar night
const LATE_CUTOFF_HOUR = 3;

/* Private booking info card — shown when title === "PRIVATE BOOKING" */
function buildBookingCard(film){
  // time comes from the film.time field; duration from film.cert (repurposed for bookings)
  const startTime = film && film.time ? String(film.time).match(/(\d{1,2}:\d{2})/)?.[1] || "" : "";
  const duration  = film && film.cert ? film.cert.trim() : "";
  // Derive end time from h:mm duration (e.g. "2:30" = 2 hrs 30 mins)
  let endTime = "";
  if(startTime && duration){
    const m = duration.match(/^(\d+):(\d{2})$/);
    if(m){
      const addMins = parseInt(m[1])*60 + parseInt(m[2]);
      if(addMins > 0){
        const [hh,mm] = startTime.split(":").map(Number);
        const total = hh*60 + mm + addMins;
        endTime = `${String(Math.floor(total/60)%24).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`;
      }
    }
  }
  // Human-readable duration label: "2:00" → "2 hrs", "2:30" → "2 hrs 30 mins", "0:45" → "45 mins"
  let durLabel = duration;
  const dm = duration.match(/^(\d+):(\d{2})$/);
  if(dm){
    const dh = parseInt(dm[1]), dmm = parseInt(dm[2]);
    if(dh && dmm)      durLabel = `${dh} hr${dh!==1?"s":""} ${dmm} min${dmm!==1?"s":""}`;
    else if(dh)        durLabel = `${dh} hr${dh!==1?"s":""}`;

    ${durLabel?`<span class="cb-slot-dur">${esc(durLabel)}</span>`:""}
  </div>` : "";

    ${timeHTML}
    <div class="cb-title">Want to Book Your Event?</div>

      ? `<div class="cb-tagline" style="color:var(--bone);font-style:normal;font-weight:600">${esc(film.blurb.trim())}</div>`
      : `<div class="cb-tagline">Magic, theatre, drag, cabaret, science, lectures, improv &amp; more</div>`}
    <div class="cb-body">We provide our cinema space to community groups to put on events for free. We do fill up months in advance, so reach out in plenty of time.</div>
    <div class="cb-rule"></div>
    <div class="cb-specs">
      <div class="cb-spec"><b>Capacity</b> Approx. 35</div>
      <div class="cb-spec"><b>Stage</b> 13 ft wide · 7 ft deep</div>
      <div class="cb-spec"><b>Height</b> 10 ft</div>
      <div class="cb-spec"><b>Access</b> No wheelchair · 18+ only</div>
    </div>
    <div class="cb-equip">
      <span class="cb-tag">Acer Predator Z650 Projector</span>
      <span class="cb-tag">Marantz AV7706 Pre-Amp</span>
      <span class="cb-tag">Sony Blu-Ray Player</span>
      <span class="cb-tag">DVD Drive &amp; USB</span>
      <span class="cb-tag">HDMI &amp; Aux inputs</span>
      <span class="cb-tag">Alto TS315 Speakers</span>
      <span class="cb-tag">Alto TS318S Subwoofers</span>
      <span class="cb-tag">Allen &amp; Heath ZED-10 Mixer</span>
      <span class="cb-tag">Shure SM58 Mics available</span>

      <span class="cb-tag">Wi-Fi (no streaming)</span>
    </div>
    <div class="cb-note">The entire venue is 18+ only. Anyone who looks under 25 must bring a driving licence or passport. Contact us well in advance — we book up months ahead.</div>
  </div>`;

async function buildCinemaTonight(now){
  // After midnight but before 3am, "today" is still yesterday for cinema purposes
  const dkey = (now.min < LATE_CUTOFF_HOUR*60)
    ? (()=>{ const d=new Date(now.date); d.setDate(d.getDate()-1); return isoDate({y:d.getFullYear(),mo:d.getMonth()+1,day:d.getDate()}); })()
    : isoDate(now);
  let films=(state.cinema||[]).filter(c=>normDate(c.date)===dkey)
    .map((c,idx)=>({...c,_idx:idx,_t:parseClock(c.time)}));
  films.sort((a,b)=> ((a._t==null?1e9:a._t)-(b._t==null?1e9:b._t)) || (a._idx-b._idx));
  for(const f of films){ f._tmdb=await tmdbLookup(f.title,f.year); }
  let clock=null;
  films.forEach(f=>{
    if(f._t!=null){ f._start=f._t; f._approx=false; clock=f._t; }
    else if(clock!=null){ f._start=clock; f._approx=true; }
    else { f._start=null; f._approx=false; }
    if(f._start!=null){ const rt=(f._tmdb&&f._tmdb.runtime)?f._tmdb.runtime:120; clock=f._start+rt+GAP_MIN; }
  });
  // Drop films that have already finished
  films=films.filter(f=>{
    if(f._start==null) return true; // no start time — always show
    const rt=(f._tmdb&&f._tmdb.runtime)?f._tmdb.runtime:120;
    const endMin=f._start+rt;
    // Handle post-midnight films
    const nowMins=(now.min < LATE_CUTOFF_HOUR*60)?now.min+1440:now.min;
    const fStart=(f._start < LATE_CUTOFF_HOUR*60 && now.min >= LATE_CUTOFF_HOUR*60)?f._start+1440:f._start;
    return nowMins < fStart+rt;
  });
  return films;
}

/* Tonight + future screenings, soonest first, start times chained per date.
   Only the first `max` are enriched from TMDB (keeps lookups light). */
async function buildUpcomingCinema(now, max){
  // After midnight but before 3am, "today" is still yesterday for cinema purposes
  const effectiveKey = (now.min < LATE_CUTOFF_HOUR*60)
    ? (()=>{ const d=new Date(now.date); d.setDate(d.getDate()-1); return isoDate({y:d.getFullYear(),mo:d.getMonth()+1,day:d.getDate()}); })()
    : isoDate(now);
  let films=(state.cinema||[])
    .map((c,idx)=>({...c,_idx:idx,_date:normDate(c.date),_t:parseClock(c.time)}))
    .filter(f=> f._date && f._date>=effectiveKey);
  films.sort((a,b)=> a._date.localeCompare(b._date) || ((a._t==null?1e9:a._t)-(b._t==null?1e9:b._t)) || (a._idx-b._idx));
  films=films.slice(0, max||4);
  for(const f of films){ f._tmdb=await tmdbLookup(f.title,f.year); }
  // chain blank start times within each date off the previous film's runtime
  const byDate={}; films.forEach(f=>{ (byDate[f._date]=byDate[f._date]||[]).push(f); });
  Object.values(byDate).forEach(list=>{
    let clock=null;
    list.forEach(f=>{
      if(f._t!=null){ f._start=f._t; f._approx=false; clock=f._t; }
      else if(clock!=null){ f._start=clock; f._approx=true; }
      else { f._start=null; f._approx=false; }
      if(f._start!=null){ const rt=(f._tmdb&&f._tmdb.runtime)?f._tmdb.runtime:120; clock=f._start+rt+GAP_MIN; }
    });
  });
  return films;
}
function cinemaDateLabel(dstr, now){
  const today=isoDate(now);
  // Late-night: if it's before LATE_CUTOFF_HOUR, "tonight" means yesterday's date
  const effectiveToday = (now.min < LATE_CUTOFF_HOUR*60)
    ? isoDate({...now, y:now.date.getFullYear(), mo:now.date.getMonth()+1,
        day:new Date(now.date.getFullYear(), now.date.getMonth(), now.date.getDate()-1).getDate()})
    : today;
  if(dstr<=effectiveToday) return "Tonight";
  const d=new Date(dstr+"T00:00:00"), t=new Date(effectiveToday+"T00:00:00");
  const diff=Math.round((d-t)/86400000);
  if(diff===1) return "Tomorrow";
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}

function isPrivateBooking(f){ return /^private\s+booking$/i.test((f.title||"").trim()); }

function buildFilmHero(film, data, whenTxt, timeTxt, reel, isLand, isNowPlaying){
  const runtimeTxt=data.runtime?`${Math.floor(data.runtime/60)}h ${data.runtime%60}m`:"";
  const overview=(film.blurb&&film.blurb.trim())?film.blurb:data.overview;
  const nowBadge=isNowPlaying
    ?`<span class="now-playing-badge"><span class="np-dot"></span>Now Playing</span>`:"";
  const meta=`<div class="cmeta">
    ${nowBadge}
    ${!isNowPlaying?`<span class="cwhen">${esc(whenTxt)}</span>`:`<span class="cwhen" style="display:none">${esc(whenTxt)}</span>`}
    ${timeTxt?`<span class="ctime">${esc(timeTxt)}</span>`:""}
    ${(film.cert&&/^(U|PG|12A?|15|18|TBC)$/i.test(film.cert.trim()))?`<span class="cert">${esc(film.cert.trim())}</span>`:""}
    ${data.year?`<span class="cyear">${esc(data.year)}</span>`:""}
    ${runtimeTxt?`<span class="cruntime">${runtimeTxt}</span>`:""}
  </div>`;
  const posterEl=data.poster
    ?`<img src="${esc(data.poster)}" alt="">`
    :`<div class="noposter">${esc(data.title||film.title)}</div>`;
  if(isLand){
    // Landscape hero: poster left (22%), backdrop right with text overlay top-left
    // Layout: label → meta → title → rule(CSS ::after) → overview
    const labelEl = isNowPlaying
      ? `<div class="cwhen" style="display:flex;align-items:center;gap:.55em"><span class="np-dot"></span>Now Playing</div>`
      : `<div class="cwhen">Tonight</div>`;
    const landMeta=`<div class="cmeta">
      <span class="ctime">${esc(timeTxt)}</span>
      ${(film.cert&&/^(U|PG|12A?|15|18|TBC)$/i.test(film.cert.trim()))?`<span class="cert">${esc(film.cert.trim())}</span>`:""}
      ${data.year?`<span class="cyear">${esc(data.year)}</span>`:""}
      ${runtimeTxt?`<span class="cruntime">${runtimeTxt}</span>`:""}
    </div>`;
    return `<div class="cinmain">
      <div class="ci-ls-left">
        <div class="poster">${posterEl}</div>
      </div>
      <div class="ci-ls-right">
        ${reel}
        <div class="cinfo">
          ${labelEl}
          ${landMeta}
          <h2 class="cname">${esc(data.title||film.title)}</h2>
          ${overview?`<p class="coverview">${esc(overview)}</p>`:""}
        </div>
      </div>

  }
  // Portrait: cinmain wrapper with column layout
  return `<div class="cinmain" style="flex-direction:column;align-items:center;width:100%">
    <div class="poster">${posterEl}</div>
    <div class="cinfo">${meta}
      <h2 class="cname">${esc(data.title||film.title)}</h2>
      ${overview?`<p class="coverview">${esc(overview)}</p>`:""}
      ${reel}
    </div>
  </div>`;
}

function buildUpNextStrip(films, now, firstLabel){
  const labels=[firstLabel||"Up Next","Later"];
  const cards=films.slice(0,2).map((f,i)=>{
    const d=f._tmdb||{};
    const tt=f._start!=null?(f._approx?"~":"")+clockLabel(f._start):(f.time||"");
    const when=cinemaDateLabel(f._date,now)+(tt?` · ${tt}`:"");
    const posterHTML=d.poster
      ?`<img class="un-poster" src="${esc(d.poster)}" alt="">`
      :`<div class="un-poster un-nopost">\u25a6</div>`;
    const backs=(d.backdrops&&d.backdrops.length)?d.backdrops.slice(0,4):(d.poster?[d.poster]:[]);
    const backImgs=backs.map((u,j)=>`<img src="${esc(u)}" alt=""${j===0?' class="active"':''}>`).join("");
    return `<div class="un-card">${posterHTML}<div class="un-back">${backImgs}

          <div class="un-when">${esc(when)}</div>

}

function buildTomorrowRow(f, now){
  const d=f._tmdb||{};
  const tt=f._start!=null?(f._approx?"~":"")+clockLabel(f._start):(f.time||"");

async function renderCinema(now, validDate){
  const wrap=document.getElementById("rooms");
  if(!validDate){ wrap.innerHTML=cinemaMsg("Choose a date to see tonight's film."); state._cinemaSig=""; return; }

  const allFilms=await buildUpcomingCinema(now, 8);
  if(!allFilms.length){ wrap.innerHTML=cinemaMsg("No screenings listed yet."); state._cinemaSig=""; return; }

  // ── All timing calculations up front so they're in scope everywhere ──
  const isLateNight = now.min < LATE_CUTOFF_HOUR * 60;
  const todayDkey = isLateNight
    ? (()=>{ const d=new Date(now.date); d.setDate(d.getDate()-1); return isoDate({y:d.getFullYear(),mo:d.getMonth()+1,day:d.getDate()}); })()
    : isoDate(now);
  const tomorrowDkey = isLateNight ? isoDate(now)
    : (()=>{ const d=new Date(now.date); d.setDate(d.getDate()+1); return isoDate({y:d.getFullYear(),mo:d.getMonth()+1,day:d.getDate()}); })();

  const todayFilms    = allFilms.filter(f=>f._date===todayDkey);
  const tomorrowFilms = allFilms.filter(f=>f._date===tomorrowDkey);
  const todayReal     = todayFilms.filter(f=>!isPrivateBooking(f));
  const todayBooking  = todayFilms.find(f=>isPrivateBooking(f));
  const tmrwReal      = tomorrowFilms.filter(f=>!isPrivateBooking(f));
  const tmrwBooking   = tomorrowFilms.find(f=>isPrivateBooking(f));

  function filmFinished(f){
    if(f._start==null) return false;
    if(f._date!==todayDkey) return false;
    const rt=(f._tmdb&&f._tmdb.runtime)?f._tmdb.runtime:120;
    const nowMins = isLateNight ? now.min + 1440 : now.min;
    const filmStart = (f._start < LATE_CUTOFF_HOUR*60 && !isLateNight) ? f._start + 1440 : f._start;
    return nowMins > filmStart + rt;
  }

  const todayActive = todayReal.filter(f=>!filmFinished(f));
  const heroFilm    = todayActive[0] || tmrwReal[0];

  // ── Sig check: if film list unchanged, update Now Playing in-place ──
  const sig = "cine|"+isoDate(now)+"|"+allFilms.map(f=>f._date+f.title+f.time).join(",");
  if(sig===state._cinemaSig && wrap.querySelector(".cinema")){
    const playing = heroFilm && heroFilm._start!=null && heroFilm._date===todayDkey && !filmFinished(heroFilm)
      && now.min >= (isLateNight ? heroFilm._start - 1440 : heroFilm._start);
    const section = wrap.querySelector(".cine-section") || wrap.querySelector(".cinema-land-inner .cine-section");
    if(section){
      section.classList.toggle("now-playing", !!playing);
      // In landscape the label is a .cwhen div inside .cinfo — update its text and dot
      const cwhen = section.querySelector(".cinfo .cwhen");
      if(cwhen){
        if(playing){
          if(!cwhen.querySelector(".np-dot")){
            const dot=document.createElement("span"); dot.className="np-dot"; cwhen.prepend(dot);
          }
          cwhen.childNodes[cwhen.childNodes.length-1].textContent="Now Playing";
        } else {
          const dot=cwhen.querySelector(".np-dot"); if(dot) dot.remove();
          cwhen.textContent="Tonight";
        }
      }
      // Also update portrait badge/cwhen
      const badge=section.querySelector(".now-playing-badge");
      const portraitCwhen=section.querySelector(".cmeta ~ .cwhen, .cmeta .cwhen");
      if(playing){
        if(!badge && !cwhen){ const b=document.createElement("span"); b.className="now-playing-badge"; b.innerHTML=`<span class="np-dot"></span>Now Playing`; const mc=section.querySelector(".cmeta"); if(mc) mc.parentNode.insertBefore(b,mc); }
        if(portraitCwhen) portraitCwhen.style.display="none";
      } else {
        if(badge) badge.remove();
        if(portraitCwhen){ portraitCwhen.style.display=""; }
      }
    }
    return;
  }
  state._cinemaSig=sig;

  if(!heroFilm && !todayBooking && !tmrwBooking){
    wrap.innerHTML=cinemaMsg("No screenings listed yet."); return;
  }

  // ── Build hero film HTML ──
  let heroHTML="", isNowPlaying=false;
  if(heroFilm){
    const data=heroFilm._tmdb||{};
    const whenTxt=cinemaDateLabel(heroFilm._date, now);
    const timeTxt=heroFilm._start!=null?(heroFilm._approx?"~":"")+clockLabel(heroFilm._start):(heroFilm.time||"");
    // Backdrop reel: use backdrops (landscape stills). If none, use blurred poster as fallback.
    const reelImgs = (data.backdrops&&data.backdrops.length)
      ? data.backdrops
      : (data.poster ? [data.poster] : []);
    const reel = reelImgs.length
      ? `<div class="reel${!data.backdrops?.length?" reel-poster-fallback":""}">${reelImgs.map((u,i)=>`<img src="${esc(u)}" alt=""${i===0?' class="active"':''}>`).join("")}</div>`
      : "";
    isNowPlaying = heroFilm._start!=null && heroFilm._date===todayDkey
      && now.min >= (isLateNight ? heroFilm._start - 1440 : heroFilm._start)
      && !filmFinished(heroFilm);
    heroHTML=buildFilmHero(heroFilm, data, whenTxt, timeTxt, reel, IS_LANDSCAPE, isNowPlaying);
  }

  const todayRest  = todayActive.slice(heroFilm&&heroFilm._date===todayDkey?1:0);
  const upNextHTML = buildUpNextStrip(todayRest, now, "Up Next");

  let tomorrowHTML="";
  if(tmrwReal.length||tmrwBooking){
    const tmrwCards=tmrwReal.map(f=>buildTomorrowRow(f,now)).join("");
    tomorrowHTML=`<div class="cine-section">
      <div class="cine-day-label tomorrow"><span class="cdl-dot"></span>Tomorrow</div>
      ${tmrwCards?`<div class="upnext"><div class="un-row">${tmrwCards}</div></div>`:""}
      ${tmrwBooking?buildBookingCard(tmrwBooking):""}
    </div>`;
  }

  const todayBookHTML=todayBooking?`<div class="cine-section">${buildBookingCard(todayBooking)}</div>`:"";

  const todaySection=heroFilm||upNextHTML?`<div class="cine-section${isNowPlaying?" now-playing":""}">
    <div class="cine-day-label"><span class="cdl-dot"></span>${isNowPlaying?"Now Playing":"Tonight"}</div>
    ${heroHTML}${upNextHTML}
  </div>`:"";

  // In landscape: wrap in an inner padding container so cards have breathing room
  if(IS_LANDSCAPE){
    wrap.innerHTML=`<div class="cinema"><div class="cinema-land-inner">
      ${todaySection}
      ${todayBookHTML}
      ${tomorrowHTML}
    </div></div>`;
  } else {
    wrap.innerHTML=`<div class="cinema">
      ${todaySection}
      ${todayBookHTML}
      ${tomorrowHTML}
    </div>`;
  }
  // crossfade the hero backdrop reel (slow dissolve, no video)
  clearInterval(state._reelTimer);
  const imgs=wrap.querySelectorAll(".reel img");
  if(imgs.length>1){
    let idx=0;
    state._reelTimer=setInterval(()=>{
      if(!document.body.contains(imgs[0])){ clearInterval(state._reelTimer); return; }
      idx=(idx+1)%imgs.length;
      imgs.forEach(im=>im.classList.remove("active"));
      imgs[idx].classList.add("active");
    }, 6500);
  }
  // Separate crossfade timers for each Up Next backdrop reel
  wrap.querySelectorAll(".un-back").forEach((back,bi)=>{
    const bImgs=back.querySelectorAll("img");
    if(bImgs.length<2) return;
    let bidx=0;
    const t=setInterval(()=>{
      if(!document.body.contains(bImgs[0])){ clearInterval(t); return; }
      bidx=(bidx+1)%bImgs.length;
      bImgs.forEach(im=>im.classList.remove("active"));
      bImgs[bidx].classList.add("active");
    }, 5200+(bi*1400));
    // timer self-cleans when DOM is removed; no explicit store needed
  });
}

/* Combined everyday board: gig list on top, cinema strip below. */
async function renderTonight(now, validDate){
  const wrap=document.getElementById("rooms");

  const key=`${now.mo}-${now.day}-${now.min}-${state.mode}-${state.dataStatus}`;

// self-heal: the moment the screen wakes / the tab is refocused, refresh immediately

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) wakeRefresh(); });
window.addEventListener("focus", wakeRefresh);
